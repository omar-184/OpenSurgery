<main class="wrap page"><div><div class="crumbs"><a href="index.html">Question Bank</a> › <a href="surgical-oncology.html">Surgical Oncology</a></div><article><h1>Surgical Oncology: Exam</h1></article><div id="quiz"></div></div></main><script>window.QUIZ_MODE="exam";window.QUIZ_DATA=[{"topic": "Principles of Cancer Surgery", "stem": "All of the following factors are suggestive of a hereditary cancer EXCEPT:", "options": ["Tumor development at a younger than typical age", "Presence of bilateral disease", "Association with paraneoplastic syndromes", "Presence of multiple primary malignancies"], "answer": "C", "answerText": "Factors suggesting hereditary cancer include tumor development at a much younger age than usual, bilateral disease, multiple primary malignancies, presentation in the less affected sex, and clustering in relatives — not paraneoplastic syndromes.", "source": "Source: *Schwartz's ABSITE*, Ch. 10 Oncology"}, {"topic": "Principles of Cancer Surgery", "stem": "Approved strategies for cancer chemoprevention include all of the following EXCEPT:", "options": ["Neurontin for malignant peripheral nerve sheath tumor", "Tamoxifen for breast cancer", "Celecoxib for FAP syndrome", "13-cis-retinoic acid for oral leukoplakia"], "answer": "A", "answerText": "See Schwartz 11th ed., p. 348.", "source": "Source: *Schwartz's ABSITE*, Ch. 10 Oncology"}, {"topic": "Principles of Cancer Surgery", "stem": "Which of the following statements is TRUE of apoptosis in cancer cells?", "options": ["Beclin 1 is an important apoptosis regulatory gene", "Chloroquin is an important inhibitor of apoptosis", "Anti-caspases are a family of genes involved in regulation of apoptosis", "DNA laddering is a typical characteristic observed with apoptosis"], "answer": "D", "answerText": "Late in apoptosis there are characteristic changes in nuclear morphology such as chromatin condensation, nuclear fragmentation, and DNA laddering.", "source": "Source: *Schwartz's ABSITE*, Ch. 10 Oncology"}, {"topic": "Principles of Cancer Surgery", "stem": "Components of cancer invasion include which of the following?", "options": ["In situ cancers involve cells which have breached the basement membrane", "Integrins regulate cell adhesion to the extracellular matrix", "Matrix metalloproteinases (MMPs) enhance the structural integrity of the extracellular matrix", "Vascular endothelial growth factor (VEGF) induces metastases exclusively through vascular channels"], "answer": "B", "answerText": "Integrins are a family of glycoproteins that regulate cell adhesion to the extracellular matrix and relay molecular signals regarding the cellular environment.", "source": "Source: *Schwartz's ABSITE*, Ch. 10 Oncology"}, {"topic": "Principles of Cancer Surgery", "stem": "Anticancer chemotherapy agents include all of the following EXCEPT:", "options": ["Alkylating agents", "Antitumor antibiotics", "Prometabolites", "Plant alkaloids"], "answer": "C", "answerText": "See Schwartz 11th ed., p. 340.", "source": "Source: *Schwartz's ABSITE*, Ch. 10 Oncology"}, {"topic": "Principles of Cancer Surgery", "stem": "Which of the following statements is TRUE of metastasis?", "options": ["If a cell can detach from a primary tumor and invade the lymphovascular system, it has a high likelihood of successfully implanting in a distant site", "Late development of metastasis as long as 20 years after primary tumor curative treatment is a common occurrence", "Tumor dormancy may be due to the host losing immunologic control of subclinical disease", "The \"seed and soil\" conception of metastasis is explained by organ-specific patterns of blood flow determinants"], "answer": "C", "answerText": "Cancer recurrences have been reported decades after the original tumor episode, a phenomenon referred to as dormancy; metastasis is an inefficient process and recurrence after 20 years is rare.", "source": "Source: *Schwartz's ABSITE*, Ch. 10 Oncology"}, {"topic": "Principles of Cancer Surgery", "stem": "Which of the following is established as an improvement in cancer management?", "options": ["Use of immunotherapy as initial therapy in some types of lung cancer", "Replacement of biopsy with serum biomarkers", "Elimination of radical surgery approaches", "Use of molecular radiotherapy sensitizers"], "answer": "A", "answerText": "With the advent of effective immune-based therapies, treatments that enhance the anticancer immune response are now standard of care for several tumors, including some types of lung carcinoma.", "source": "Source: *Schwartz's ABSITE*, Ch. 10 Oncology"}, {"topic": "Principles of Cancer Surgery", "stem": "Which of the following is TRUE regarding biomarkers?", "options": ["Prognostic biomarkers predict response to specific treatments", "Predictive biomarkers predict likelihood of survival for specific tumors", "Results of multigene assays can be linked together to provide optimal survival predictability", "Circulating free DNA is more informative as solid tumor biomarkers than circulating free proteins"], "answer": "C", "answerText": "Multigene profiles to predict prognosis are in the validation phase for many solid tumor types; prognostic markers predict survival whereas predictive markers predict response to therapy.", "source": "Source: *Schwartz's ABSITE*, Ch. 10 Oncology"}, {"topic": "Sarcoma", "stem": "All of the following are known molecular pathogenic events in sarcoma EXCEPT:", "options": ["Chromosomal translocations", "Oncogene amplification", "Complex genomic rearrangements", "Proteomic suppression"], "answer": "", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 36 Soft Tissue Sarcomas"}, {"topic": "Sarcoma", "stem": "Concerning sarcoma of the breast, which of the following is TRUE?", "options": ["Modified radical mastectomy is a standard treatment for tumors > 5 cm", "Sentinel node biopsy is a standard treatment", "Leiomyosarcoma is the most common histology of breast sarcoma", "Lumpectomy is a standard treatment for T1 breast sarcoma"], "answer": "D", "answerText": "Complete excision with negative margins is the primary therapy, and simple mastectomy confers no additional benefit if complete excision can be accomplished by segmental mastectomy.", "source": "Source: *Schwartz's ABSITE*, Ch. 36 Soft Tissue Sarcomas"}, {"topic": "Sarcoma", "stem": "Current therapy for American Joint Committee on Cancer (AJCC) Stage III soft tissue sarcoma of the extremity includes all of the following EXCEPT:", "options": ["Chemotherapy", "Immunotherapy", "Radiation therapy", "Surgical excision"], "answer": "B", "answerText": "Primary tumors are managed with surgery, with radiation therapy for high-grade extremity/trunk sarcomas and chemotherapy considered to downstage large tumors; immunotherapy is not part of current therapy.", "source": "Source: *Schwartz's ABSITE*, Ch. 36 Soft Tissue Sarcomas"}, {"topic": "Sarcoma", "stem": "Factors that are part of the American Joint Committee on Cancer (AJCC) sarcoma staging system include all of the following EXCEPT:", "options": ["Tumor location", "Tumor size", "Number of mitoses per high powered field", "Ki-67 positivity"], "answer": "D", "answerText": "The AJCC staging system for soft tissue sarcomas is based on histologic grade, tumor size and depth, and the presence of metastases, with number of mitoses per high-power field among the features defining grade — not Ki-67.", "source": "Source: *Schwartz's ABSITE*, Ch. 36 Soft Tissue Sarcomas"}, {"topic": "Melanoma", "stem": "What is the most common site of distant metastasis of cutaneous melanoma?", "options": ["Brain", "Lung", "Bone", "Distant skin"], "answer": "B", "answerText": "The most common sites of metastasis of melanoma are the lung and liver, followed by the brain, gastrointestinal tract, distant skin, and subcutaneous tissue.", "source": "Source: *Schwartz's ABSITE*, Ch. 16 The Skin and Subcutaneous Tissue"}, {"topic": "Melanoma", "stem": "Using the ABCDE initialism for melanoma, at what diameter does a nevus become concerning for malignant transformation?", "options": ["2 mm", "4 mm", "6 mm", "10 mm"], "answer": "C", "answerText": "Concerning lesions are typically asymmetric with irregular borders, color variations, a diameter > 6 mm, and undergoing some sort of evolution or change.", "source": "Source: *Schwartz's ABSITE*, Ch. 16 The Skin and Subcutaneous Tissue"}, {"topic": "Melanoma", "stem": "Which aggressive subtype of melanoma is characterized by an early vertical growth pattern, often leading to later-stage diagnosis?", "options": ["Superficial spreading", "Lentigo maligna", "Acral lentiginous", "Nodular"], "answer": "D", "answerText": "The nodular subtype accounts for 15% to 30% of melanomas, typically arises de novo, and is aggressive with an early vertical growth pattern and diagnosis at a later stage.", "source": "Source: *Schwartz's ABSITE*, Ch. 16 The Skin and Subcutaneous Tissue"}, {"topic": "Lymphoma (Surgical Aspects)", "stem": "Which of the following options is the best initial management of a low-grade mucosa-associated lymphoid tissue (MALT) lymphoma of the gastric antrum?", "options": ["Helicobacter pylori eradication", "Chemotherapy +/- radiation therapy", "Wedge resection", "Antrectomy"], "answer": "A", "answerText": "Low-grade MALT lymphoma arises from chronic gastritis associated with H. pylori and often disappears when H. pylori is eradicated, so it is not a surgical lesion.", "source": "Source: *Schwartz's ABSITE*, Ch. 26 The Stomach"}, {"topic": "Lymphoma (Surgical Aspects)", "stem": "A patient with which of the following diseases would most benefit from splenectomy?", "options": ["Acute myeloid leukemia with neutropenia", "Chronic lymphocytic leukemia with thrombocytopenia", "Hairy cell leukemia with abnormal lymphocytes", "Hodgkin lymphoma with lymphocytopenia"], "answer": "B", "answerText": "In chronic lymphocytic leukemia, splenectomy is indicated to improve cytopenias, was shown to be 75% effective, and may facilitate chemotherapy in patients with prohibitively low cell counts.", "source": "Source: *Schwartz's ABSITE*, Ch. 34 The Spleen"}, {"topic": "Metastatic Disease Management", "stem": "Surgical resection of distant metastatic disease for tumor control is enhanced by all of the following EXCEPT:", "options": ["Pre-resection tumor shrinkage using chemotherapy", "Long interval between primary tumor treatment and subsequent development of metastasis", "Tumor type", "Open versus minimally invasive surgical approaches"], "answer": "D", "answerText": "The goal is to resect metastases with negative margins whether or not open or MIS approaches are used; cancer type and a long disease-free interval are associated with higher survival after metastasectomy.", "source": "Source: *Schwartz's ABSITE*, Ch. 10 Oncology"}];</script><script src="../assets/quiz.js"></script>
