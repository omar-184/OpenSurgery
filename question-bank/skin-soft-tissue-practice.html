<main class="wrap page"><div><div class="crumbs"><a href="index.html">Question Bank</a> › <a href="skin-soft-tissue.html">Skin &amp; Soft Tissue</a></div><article><h1>Skin &amp; Soft Tissue: Practice</h1></article><div id="quiz"></div></div></main><script>window.QUIZ_MODE="practice";window.QUIZ_DATA=[{"topic": "Skin Cancer (BCC/SCC)", "stem": "A 3-mm, nodular-type basal cell carcinoma (BCC) of the skin of the trunk should be treated with:", "options": ["Mohs micrographic surgery", "Dermatologic laser vaporization", "Excision with a 4-mm margin of normal tissue", "Electrodesiccation"], "answer": "C", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 16 The Skin and Subcutaneous Tissue"}, {"topic": "Skin Cancer (BCC/SCC)", "stem": "What subtype of basal cell carcinoma (BCC) is the most common, characterized by raised, pearly pink papules with telangiectasias and occasionally a depressed tumor center with raised borders?", "options": ["Micronodular", "Infiltrating", "Superficial spreading", "Nodular"], "answer": "D", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 16 The Skin and Subcutaneous Tissue"}, {"topic": "Skin Cancer (BCC/SCC)", "stem": "Which of these skin lesions can represent a precursor lesion to squamous cell carcinoma?", "options": ["Seborrheic keratosis", "Actinic keratosis", "Congenital nevus", "Acrochordons"], "answer": "B", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 16 The Skin and Subcutaneous Tissue"}, {"topic": "Skin Cancer (BCC/SCC)", "stem": "The most common primary malignant tumor of the hand is:", "options": ["Melanoma", "Basal cell carcinoma", "Squamous cell carcinoma (SCC)", "Epithelioid sarcoma"], "answer": "C", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 44 Surgery of the Hand and Wrist"}, {"topic": "Soft Tissue Infections (Cellulitis/Abscess/Necrotizing Fasciitis)", "stem": "Initial treatment of extensive cellulitis without abscess is:", "options": ["Vancomycin", "β-lactam", "Linezolid", "Clindamycin"], "answer": "B", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 16 The Skin and Subcutaneous Tissue"}, {"topic": "Soft Tissue Infections (Cellulitis/Abscess/Necrotizing Fasciitis)", "stem": "The first step in the evaluation and treatment of a patient with an infected bug bite on the leg with cellulitis, bullae, thin grayish fluid draining from the wound, and pain out of proportion to the physical findings is:", "options": ["Obtain C-reactive protein", "Computed tomographic scan of the leg", "Magnetic resonance imaging of the leg", "Operative exploration"], "answer": "D", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 6 Surgical Infection"}, {"topic": "Soft Tissue Infections (Cellulitis/Abscess/Necrotizing Fasciitis)", "stem": "Which of the following statements is FALSE concerning Fournier's gangrene (necrotizing fasciitis)?", "options": ["Mortality is 25%", "Risk factors include diabetes, obesity, and alcoholism", "Often polymicrobial", "Prompt surgical debridement mandatory"], "answer": "A", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 40 Urology"}, {"topic": "Lipoma and Sebaceous Cyst", "stem": "Which congenital cyst is caused by persistent epithelium across embryonic fusion lines, most commonly between the forehead and tip of the nose?", "options": ["Trichilemmal cyst", "Epidermoid cyst", "Dermoid cyst", "Nevus"], "answer": "C", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 16 The Skin and Subcutaneous Tissue"}, {"topic": "Wound Healing", "stem": "Normal wound healing is divided into phases defined by characteristic cellular populations and biochemical interactions. They are:", "options": ["Hemostasis and inflammation, proliferation, maturation, and remodeling", "Hemostasis, proliferation and inflammation, matrix deposition, maturation, and remodeling", "Hemostasis and inflammation, platelet aggregation, maturation and remodeling", "Hemostasis, inflammation, remodeling and maturation"], "answer": "A", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 9 Wound Healing"}, {"topic": "Wound Healing", "stem": "Which of the following is FALSE regarding polymorphonuclear neutrophils (PMNs) and their role in wound healing?", "options": ["PMNs release proteases that degrade ground substance within the wound site", "Neutrophils use fibrin clot generated at the wound as scaffolding for migration into the wound", "Neutrophil migration is stimulated by local prostaglandins, complement factors, IL-1, TNFα, GF-β, platelet factor 4, or bacterial products", "PMNs are the first cells to infiltrate the wound, peaking at 24 to 48 hours", "Neutrophils release cytokines that later assist with collagen deposition and epithelial closure"], "answer": "E", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 9 Wound Healing"}, {"topic": "Wound Healing", "stem": "The proliferative phase of wound healing occurs how long after the injury?", "options": ["1 day", "2 days", "7 days", "14 days"], "answer": "C", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 9 Wound Healing"}, {"topic": "Wound Healing", "stem": "Which of the following is TRUE regarding the fibroplastic phase of wound healing?", "options": ["Early during wound healing, the predominant composititon of the matrix is fibronectin and type II collagen", "After complete replacement of the scar with type III collagen, the mechanical strength will equal that of uninjured tissue approximately 6 to 12 months postinjury", "Even though the tensile strength of a wound reaches a plateau after several weeks, the tensile strength will increase over another 6 to 12 months due to fibril formation and cross-linking", "As the scar matures, matrix metalloproteinases break down type I collagen and replace it with type III collagen"], "answer": "C", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 9 Wound Healing"}, {"topic": "Wound Healing", "stem": "Dermal wounds in patients with Ehlers-Danlos syndrome (EDS) should be:", "options": ["Closed in one layer with sutures removed early to prevent deformity", "Closed in two layers, under tension, with sutures removed after twice as long time", "Allowed to heal by secondary intention, as would commonly fall apart", "There is no benefit to external fixation with adhesive tapes"], "answer": "B", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 9 Wound Healing"}, {"topic": "Wound Healing", "stem": "Patients with Marfan syndrome are associated with what genetic defect?", "options": ["MFN-1 gene deletion", "Type I collagen gene mutation", "COL7A1 gene mutation", "FBN-1 gene mutation"], "answer": "D", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 9 Wound Healing"}];</script><script src="../assets/quiz.js"></script>
