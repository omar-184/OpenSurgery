<main class="wrap page"><div><div class="crumbs"><a href="index.html">Question Bank</a> › <a href="colorectal.html">Colorectal</a></div><article><h1>Colorectal: Exam</h1></article><div id="quiz"></div></div></main><script>window.QUIZ_MODE="exam";window.QUIZ_DATA=[{"topic": "Colorectal Cancer", "stem": "\"A 67-year-old man is diagnosed with a rectal cancer after undergoing colonoscopy for bloody stools and weight loss. Which of the following statements is FALSE regarding the use of endorectal ultrasound for rectal lesions?", "options": ["The rectal wall appears as a four-layer structure on ultrasound", "Ultrasound can reliably distinguish between most benign and malignant rectal polyps", "Ultrasound is useful for determining depth of rectal cancer invasion", "Identification of involved perirectal lymph nodes via ultrasound is possible in most cases.\""], "answer": "A", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 29 Colon, Rectum, and Anus"}, {"topic": "Colorectal Cancer", "stem": "\"Which of the following is not a component of the Amsterdam II criteria for the diagnosis of Lynch syndrome, or hereditary nonpolyposis colorectal cancer (HNPCC)?", "options": ["Three relatives affected by an HNPCC-associated malignancy", "One cancer occurred before the age of 40", "One relative must be a first-degree relative of the other two", "Two affected generations.\""], "answer": "B", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 29 Colon, Rectum, and Anus"}, {"topic": "Colorectal Cancer", "stem": "\"A pathologist is reviewing slides of a resected colon cancer specimen. The cancer was noted to invade through the bowel wall into the subserosa. There was one involved lymph node. Assuming there was no distant metastatic disease noted on preoperative imaging, what is the correct tumor-node-metastasis (TNM) classification and stage?", "options": ["T3N1M0, stage II", "T4N1M0, stage II", "T3N1M0, stage III", "T4N1M0, stage III.\""], "answer": "C", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 29 Colon, Rectum, and Anus"}, {"topic": "Colorectal Cancer", "stem": "\"How can the role of adjuvant chemotherapy following resection of colon cancer be most accurately described?", "options": ["Adjuvant chemotherapy should be used after all colon cancer resections to reduce the risk of recurrence and improve overall survival", "Adjuvant chemotherapy has the best evidence for routine use in those with positive lymph nodes", "Microsatellite instable (MSI)-high patients do not respond to adjuvant chemotherapy and therefore should not be offered it", "As long as lymph nodes are negative, patients with stage II disease do not benefit from adjuvant chemotherapy.\""], "answer": "B", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 29 Colon, Rectum, and Anus"}, {"topic": "Colorectal Cancer", "stem": "\"Which of the following statements about total mesorectal excision (TME) for rectal cancer is TRUE?", "options": ["TME improves local recurrence but not long-term survival", "TME is not necessary for rectosigmoid tumors", "TME is associated with less blood loss than a blunt dissection", "TME carries a higher risk of injury to the pelvic nerves than a blunt dissection.\""], "answer": "C", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 29 Colon, Rectum, and Anus"}, {"topic": "Colorectal Cancer", "stem": "\"A 74-year-old man with biopsy-proven rectal adenocarcinoma is undergoing a low anterior resection. Which layers must be stapled through when resecting the distal portion of resection specimen?", "options": ["Mucosa, submucosa, circular muscle layer, longitudinal muscle layer, and serosa", "Mucosa, submucosa, longitudinal muscle layer, circular muscle layer, and serosa", "Mucosa, submucosa, longitudinal muscle layer, circular muscle layer.\""], "answer": "C", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 29 Colon, Rectum, and Anus"}, {"topic": "Colorectal Cancer", "stem": "\"A healthy 48-year-old physician with no family history of caner [sic] and who strictly adheres to a high protein, high fiber diet, exercises five times per week for 50 minutes, and takes vitamin C supplements daily performs a fecal occult blood test (FOBT) on herself and tests positive. Should she have any further colon screening?", "options": ["No, vitamin C can produce a false positive result", "Yes, all positive FOBT requires further investigation with a colonoscopy", "Yes, all positive FOBT requires further investigation with FOBT in 1 year", "No, she has no risk factors for colon cancer and should follow the United States Preventive Services Task Force (USPSTF) screening guidelines for colorectal cancer.\""], "answer": "B", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 29 Colon, Rectum, and Anus"}, {"topic": "Diverticular Disease", "stem": "\"Which of the following is an incorrect statement about the management of diverticulitis?", "options": ["Uncomplicated diverticulitis is typically treated in the outpatient setting", "Hospitalized patients who fail to improve should be assessed with a computed tomography (CT) scan for abscess formation", "Worsening abdominal pain in a patient hospitalized with diverticulitis should be addressed with broadening of antibiotics", "Most patients with uncomplicated diverticulitis will never have another episode.\""], "answer": "C", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 29 Colon, Rectum, and Anus"}, {"topic": "Appendicitis", "stem": "\"A 55-year-old man has computed tomography (CT) evidence of complicated appendicitis with a contained abscess in the right lower quadrant (RLQ). He is mildly tachycardic, afebrile, and normotensive with local RLQ tenderness but no peritonitis. What is the optimal approach to this patient?", "options": ["Immediate laparotomy", "Laparoscopic exploration and abscess drainage", "Percutaneous drainage, intravenous (IV) fluids, bowel rest, and broad spectrum antibiotics", "IV fluids, bowel rest, and broad spectrum antibiotics.\""], "answer": "C", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 30 The Appendix"}, {"topic": "Appendicitis", "stem": "\"A 25-year-old man presents with migratory right lower quadrant (RLQ) pain, leukocytosis, and a computed tomography (CT) scan consistent with acute, uncomplicated appendicitis. He is physiologically normal and it is 2 AM. You are planning an appendectomy, what difference might be expected in his outcome if his operation is delayed until the next morning?", "options": ["Increased risk of an intra-abdominal abscess", "Increased risk of surgical-site infection", "Decreased operative time", "Increased risk of perforation", "No difference in perforation rates, surgical-site infection, abscess, conversion rate, or operative time.\""], "answer": "E", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 29 Colon, Rectum, and Anus"}, {"topic": "Appendicitis", "stem": "\"An 8-year-old boy presents to the emergency department complaining of generalized abdominal pain over the past 24 hours. Laboratory tests reveal a leukocytosis of 13,000 and he is tender in the right lower quadrant (RLQ) on physical examination. He is taken to the operating room for laparoscopic appendectomy. Removal of the appendix has been associated with a protective effect to which of the following?", "options": ["Crohn colitis", "Ulcerative colitis", "Clostridium difficile", "Carcinoid.\""], "answer": "B", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 30 The Appendix"}, {"topic": "Crohn's Disease", "stem": "\"Crohn's disease affects the small intestine in 80% of cases, and the colon alone in 20%. Isolated perineal and anorectal disease occurs in 5% to 10% of patients. In addition, extraintestinal manifestations of Crohn's disease occur in up to 25% of patients and may include which of the following?", "options": ["Erythema nodosum", "Interstitial lung disease", "Nephrolithiasis", "All of the above.\""], "answer": "D", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 28 Small Intestine"}, {"topic": "Crohn's Disease", "stem": "\"The primary genetic defect associated with Crohn's disease is a mutation of the NOD2 gene on chromosome 16. This gene encodes for a protein product which:", "options": ["Mediates the innate immune response to microbial pathogens", "Activates stellate cells to produce collagen", "Regulates the rate of crypt-to-villus enterocyte migration", "Mediates the production of enterocyte alkaline phosphatase.\""], "answer": "A", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 28 Small Intestine"}, {"topic": "Crohn's Disease", "stem": "\"In the resection of a stenotic area of intestine in a patient with Crohn's disease, the best approach is:", "options": ["A resection margin of 2 cm from gross disease", "A resection margin of 12 cm from gross disease", "A resection margin of 2 cm from microscopic disease on frozen section", "A resection margin of 12 cm from microscopic disease on frozen section.\""], "answer": "A", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 28 Small Intestine"}, {"topic": "Ulcerative Colitis", "stem": "\"An 18-year-old woman is undergoing workup to determine if she has ulcerative colitis, Crohn disease, or indeterminate colitis. What diagnostic findings would indicate that she has ulcerative collitis [sic]?", "options": ["Atrophic mucosa, crypt abscesses, inflammatory pseudopolyps, scarred and shortened colon, continuous involvement of rectum and colon", "Mucosal ulcerations, noncaseating granulomas, fibrosis, strictures, and fistulas in the colon with deep serpiginous ulcers", "Atrophic mucosa, noncaseating granulomas, strictures, 'cobblestone' appearance on endoscopy", "Mucosal ulcerations, crypt abscesses, inflammatory pseudopolyps, continuous involvement of colon and rectum.\""], "answer": "A", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 29 Colon, Rectum, and Anus"}, {"topic": "Ulcerative Colitis", "stem": "\"A 50-year-old woman who underwent a total colectomy with ileal pouch-anal reconstruction 5 years ago presents to the emergency room with diarrhea, fever, 2 weeks of malaise, and severe abdominal pain. What is the most appropriate differential diagnosis?", "options": ["Parasitic infection, ulcerative colitis of the remaining rectal cuff, undiagnosed Crohn disease", "Bacterial or viral infection, undiagnosed Crohn disease, and pouchitis", "Rectal cancer of remaining rectal cuff, bacterial or viral infection, and undiagnosed Crohn disease", "Parasitic infection, bacterial or viral infection, and pouchitis.\""], "answer": "B", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 29 Colon, Rectum, and Anus"}, {"topic": "Hemorrhoids", "stem": "\"Which of the following is the correct pairing of each internal hemorrhoid classification and its definition?", "options": ["First-degree: no prolapse, visualized endoscopically only", "Second-degree: prolapse into the anal canal only", "Third-degree: prolapse through the anus that requires manual reduction", "Fourth-degree: a term reserved for prolapsed hemorrhoids that are strangulated.\""], "answer": "C", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 29 Colon, Rectum, and Anus"}, {"topic": "Hemorrhoids", "stem": "\"An emergency room physician calls you in the middle of the night. One of your patients, on whom you performed rubber band ligation of internal hemorrhoids in the office earlier that day, is being seen in the emergency room (ER) for severe pelvic pain and inability to urinate. How do you respond?", "options": ["'This is a common scenario after rubber band ligation. The patient should get a prescription for opioid pain medication and can follow up in my office next week to ensure the pain is resolved.'", "'This pain can be seen with urinary retention. The patient can undergo straight catheterization in the ER and is appropriate to discharge after demonstrating the ability to void independently.'", "'The patient should be admitted for broad-spectrum antibiotics, and I will see the patient after my scheduled cases tomorrow.'", "'I am concerned about a rare but serious complication. I will be there to examine the patient immediately.'\""], "answer": "D", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 29 Colon, Rectum, and Anus"}, {"topic": "Rectal Prolapse", "stem": "\"Which operation for rectal prolapse is associated with the lowest recurrence rate?", "options": ["Perineal rectosigmoidectomy (Altemeier procedure)", "Reefing the rectal mucosa (Delorme procedure)", "Anal encirclement", "Abdominal rectopexy.\""], "answer": "D", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 29 Colon, Rectum, and Anus"}, {"topic": "Bowel Obstruction", "stem": "\"A closed loop obstruction is particularly dangerous because:", "options": ["Intraluminal pressure rises high enough to cause ischemia and necrosis", "The obstruction is painless", "Bacterial overgrowth results in sepsis", "The obstructive segment is not apparent on imaging studies.\""], "answer": "A", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 28 Small Intestine"}, {"topic": "Bowel Obstruction", "stem": "\"The radiologic evaluation of a suspected small bowel obstruction may require use of a contrast agent to confirm the location and possible etiology of the obstruction. Water-soluble contrast agents, such as gastrograffin, are preferable to barium for all of the following reasons EXCEPT:", "options": ["Gastrograffin is safer than barium if a perforation has occurred", "Gastrograffin may facilitate the resolution of a partial small bowel obstruction", "Gastrograffin small bowel studies are easier to perform", "Gastrograffin may detect subtle mucosal abnormalities more sensitively than barium.\""], "answer": "C", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 28 Small Intestine"}, {"topic": "Bowel Obstruction", "stem": "\"Therapy of a small bowel obstruction usually consists of prompt surgical correction. In patients with no evidence of closed loop obstruction, and in whom there is no fever or leukocytosis or tachycardia, a period of careful observation with nasogastric decompression may be successful in all of the following conditions EXCEPT:", "options": ["Partial small bowel obstruction", "Obstruction in the early postoperative period", "Obstruction due to Crohn disease", "Obstruction due to an internal hernia.\""], "answer": "D", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 28 Small Intestine"}, {"topic": "Bowel Obstruction", "stem": "\"Laparoscopic surgery for bowel obstruction may be preferable to open surgery for all of the following reasons EXCEPT:", "options": ["Laparoscopic surgery is associated with fewer wound infections and a shorter length of hospital stay", "Laparoscopic surgery is preferable in cases where a single adhesive band is causing the obstruction", "Laparoscopic surgery is less likely to produce further adhesion formation which may cause recurrent obstruction", "The risk of iatrogenic bowel injury is higher with laparoscopic surgery.\""], "answer": "D", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 28 Small Intestine"}, {"topic": "Bowel Obstruction", "stem": "\"Which of the following scenarios describes appropriate use of endoscopy in the setting of volvulus?", "options": ["A 75-year-old man presenting with sigmoid volvulus and peritonitis, since he needs emergent detorsion", "An 80-year-old woman presenting with cecal volvulus, due to the low rates of recurrence of cecal volvulus following colonoscopic detorsion", "A 90-year-old woman with sigmoid volvulus and moderate abdominal tenderness, since she is hemodynamically stable.\""], "answer": "C", "answerText": "", "source": "Source: *Schwartz's ABSITE*, Ch. 29 Colon, Rectum, and Anus"}];</script><script src="../assets/quiz.js"></script>
