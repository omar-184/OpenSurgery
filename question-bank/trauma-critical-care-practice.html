<main class="wrap page"><div><div class="crumbs"><a href="index.html">Question Bank</a> › <a href="trauma-critical-care.html">Trauma &amp; Critical Care</a></div><article><h1>Trauma &amp; Critical Care: Practice</h1></article><div id="quiz"></div></div></main><script>window.QUIZ_MODE="practice";window.QUIZ_CATEGORY="trauma-critical-care";window.QUIZ_DATA=[{"id": "trauma-critical-care-c0547c23", "topic": "ATLS Primary and Secondary Survey", "stem": "A trauma patient arrives following a stab wound to the left chest with systolic blood pressure (SBP) 85 mm Hg, which improves slightly with intravenous (IV) fluid resuscitation. Chest X-ray demonstrates clear lung fields. What is the most appropriate next step?", "options": ["Computed tomography (CT) scan of the chest", "Pelvic X-ray", "Focused abdominal sonography for trauma (FAST) examination", "Tube thoracostomy of the left chest"], "answer": "C", "answerText": "Hemothorax is unlikely given the normal chest X-ray, so hemoperitoneum and cardiac tamponade should be suspected, and diagnosis is best achieved by bedside ultrasound of the pericardium, one of the four views of the FAST examination.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 7"}, {"id": "trauma-critical-care-2a5490db", "topic": "ATLS Primary and Secondary Survey", "stem": "A 26-year old male patient presents to the emergency department (ED) after being involved in a rollover motor vehicle accident. He is awake and alert with GCS14. He is tachypneic with labored breathing and hypotensive with BP 80/palp. During primary survey you note distended veins on the left neck and decreased breath sounds over the left chest. The best next step in this patient's care is:", "options": ["Needle thoracostomy decompression with a 14-gauge needle", "Obtain a chest X-ray and proceed to secondary survey", "Tube thoracostomy in the midaxillary line", "Orotracheal intubation"], "answer": "C", "answerText": "Hypotension with decreased breath sounds indicates tension pneumothorax, and tube thoracostomy in the midaxillary line should be performed immediately in the emergency department before a chest radiograph is obtained.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 7"}, {"id": "trauma-critical-care-298bafcc", "topic": "ATLS Primary and Secondary Survey", "stem": "Patients who are conscious, without tachypnea, and have a normal voice are unlikely to require air intervention. Additional findings that should prompt airway intervention include all of the following EXCEPT:", "options": ["Penetrating injury to the neck with expanding hematoma", "Evidence of chemical or thermal injury to mouth, nares, or hypopharynx", "Extensive subcutaneous air in the neck", "Right pneumohemothorax", "Airway bleeding"], "answer": "D", "answerText": "Simple pneumohemothorax is not an indication for airway intervention during the primary survey.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 7"}, {"id": "trauma-critical-care-1306aae6", "topic": "ATLS Primary and Secondary Survey", "stem": "Which of the following qualifies as pneumothorax as a tension pneumothorax?", "options": ["Distended neck veins", "Tracheal deviation", "Hypotension", "Subcutaneous emphysema"], "answer": "C", "answerText": "Tension pneumothorax and simple pneumothorax have similar signs, symptoms, and examination findings, but hypotension qualifies the pneumothorax as a tension pneumothorax.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 7"}, {"id": "trauma-critical-care-479568cc", "topic": "ATLS Primary and Secondary Survey", "stem": "Which of the following is NOT one of the four injuries that should be identified during the \"circulation\" section of the primary survey?", "options": ["Massive hemothorax", "Extremity vascular injury", "Cardiac tamponade", "Massive hemoperitoneum"], "answer": "B", "answerText": "The four life-threatening injuries to identify promptly during the circulation section are massive hemothorax, cardiac tamponade, massive hemoperitoneum, and mechanically unstable pelvic fractures with bleeding.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 7"}, {"id": "trauma-critical-care-4b4df056", "topic": "ATLS Primary and Secondary Survey", "stem": "For motor vehicle collisions, which of the following variables are NOT among those strongly associated with life-threatening injuries?", "options": ["Head on impact", "Death of another occupant in the vehicle", "Extrication time >20 minutes", "Change in velocity of >20 MPH", "Lack of restraint use"], "answer": "A", "answerText": "The variables strongly associated with life-threatening injuries are death of another occupant, extrication time >20 minutes, change in velocity >20 mph, lack of restraint use, and lateral (not head-on) impact.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 7"}, {"id": "trauma-critical-care-32378ef4", "topic": "Abdominal Trauma", "stem": "An 18-year-old man is admitted to the emergency department (ED) shortly after being involved in an automobile accident. His Glasgow Coma Score (GCS) is 7. His pulse is barely palpable at a rate of 140 beats per minute, and BP is 60/0. Breathing is rapid and shallow, aerating both lung fields. His abdomen is moderately distended with no audible peristalsis. There are closed fractures of the right forearm and the left lower leg. After rapid intravenous (IV) administration of 2 L of lactated Ringer solution in the upper extremities, his pulse is 130 and BP 70/0. The next immediate step should be to:", "options": ["Obtain cross-table lateral X-rays of the cervical spine", "Obtain head and abdominal CT scans", "Obtain supine and lateral decubitus X-rays of the abdomen", "Obtain an arch aortogram", "Intubate and proceed to the operating room (OR) to explore the abdomen"], "answer": "E", "answerText": "This patient has had no response to a rapid fluid challenge, the most likely problem is uncontrolled abdominal hemorrhage, and immediate abdominal exploration offers the best chance for survival.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 7"}, {"id": "trauma-critical-care-1ea3cdc1", "topic": "Abdominal Trauma", "stem": "After sustaining a gunshot wound to the right upper quadrant of the abdomen, the patient has no signs of peritonitis. Her vital signs are stable, and CT scan shows a grade III liver injury. What is the next step in management?", "options": ["Exploratory laparotomy with control of hepatic parenchymal hemorrhage", "Admission to surgical intensive care unit (SICU) with serial complete blood count", "Admission to SICU with repeat CT in 24 hours", "Hepatic angiography"], "answer": "B", "answerText": "Nonoperative management of solid organ injuries is pursued in hemodynamically stable patients without peritonitis, and patients with greater than grade II injuries should be admitted to the SICU with frequent hemodynamic monitoring, hemoglobin determination, and abdominal examination.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 7"}, {"id": "trauma-critical-care-55b12d98", "topic": "Abdominal Trauma", "stem": "After an automobile accident, a 30-year-old woman is discovered to have a posterior pelvic fracture. Hypotension and tachycardia respond marginally to volume replacement. Once it is evident that her major problem is free intraperitoneal bleeding and a pelvic hematoma in association with the fracture, appropriate management would be:", "options": ["Application of medical antishock trousers with inflation of the extremity and abdominal sections", "Arterial embolization of the pelvic vessels", "Celiotomy and ligation of the internal iliac arteries bilaterally", "Celiotomy and pelvic packing", "External fixation application to stabilize the pelvis"], "answer": "D", "answerText": "Most severe pelvic hemorrhage is venous in origin, and once the hematoma has ruptured into the peritoneal cavity, celiotomy with pelvic packing offers the best hope of control.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 7"}, {"id": "trauma-critical-care-e909cf03", "topic": "Abdominal Trauma", "stem": "Which of the following statements is correct regarding traumatic spleen injury?", "options": ["An elevation in WBC to 20,000/mm3 and platelets to 300,000/mm3 on postoperative day 7 is a common benign finding in postsplenectomy patients", "Delayed rebleeding or rupture will typically occur within 48 hours of injury", "Common complications after splenectomy include subdiaphragmatic abscess, pancreatic tail injury, and gastric perforation", "Postsplenectomy vaccines against encapsulated bacteria are optimally administered preoperatively or immediately postoperative"], "answer": "C", "answerText": "Common sources of morbidity after splenectomy include subphrenic abscess, iatrogenic pancreatic tail injury, and gastric perforation during short gastric vessel ligation, whereas vaccines are optimally administered >14 days postinjury.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 7"}, {"id": "trauma-critical-care-a90132b5", "topic": "Thoracic Trauma", "stem": "Which of the following does NOT describe flail chest?", "options": ["Fracture of greater than at least three ribs on both sides of the chest", "Three of more ribs fractured in at least two locations", "Paradoxical movement of a free floating segment of chest wall", "High likelihood of associated pulmonary contusion"], "answer": "A", "answerText": "Flail chest occurs when three or more contiguous ribs are fractured in at least two locations, producing paradoxical movement of a free-floating chest wall segment, and the associated pulmonary contusion is the source of respiratory failure.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 7"}, {"id": "trauma-critical-care-6b95aa1b", "topic": "Head Injury (Surgical Aspects)", "stem": "A patient with spontaneous eye opening, who is confused and localizes pain has a Glasgow Coma Score (GCS) of:", "options": ["9", "11", "13", "15"], "answer": "C", "answerText": "The GCS is calculated by adding the best motor, verbal, and eye-opening responses; spontaneous eye opening (4), confused speech (4), and localizing pain (5) sum to 13.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 7"}, {"id": "trauma-critical-care-c1397627", "topic": "Head Injury (Surgical Aspects)", "stem": "Medical management of traumatic brain injury with an associated subdural hematoma requires which steps to minimize secondary injury including:", "options": ["High-dose methylprednisolone to reduce 6-month mortality, especially in severe traumatic brain injury", "Antiseizure and peptic ulcer prophylaxis as well as blood glucose, vital sign, and temperature monitoring", "Permissive hypotension to reduce intracranial hematoma growth", "Prophylactic administration of platelets for patients with intracranial hemorrhage and exposure to aspirin"], "answer": "B", "answerText": "Antiseizure prophylaxis decreases early posttraumatic seizures, ulcer prophylaxis should be used for Cushing ulcers, and hyperglycemia and hyperthermia are toxic to injured neurons and contribute to secondary injury.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 42 Neurosurgery"}, {"id": "trauma-critical-care-05e5babc", "topic": "Burns", "stem": "A 22-year-old man is brought to the emergency room after a house fire. He has burns around his mouth and his voice is hoarse, but breathing is unlabored. What would be the most appropriate next step in management?", "options": ["Immediate endotracheal intubation", "Examination of oral cavity and pharynx, with fiberoptic laryngoscope if available", "Place on supplemental oxygen", "Placement of two large-bore IV catheters with fluid resuscitation"], "answer": "B", "answerText": "Perioral burns and singed nasal hairs alone do not indicate an upper airway injury but are signs that the oral cavity and pharynx should be further evaluated for mucosal injury.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 8 Burns"}, {"id": "trauma-critical-care-b0a90ee5", "topic": "Burns", "stem": "What percentage burn does a patient have who has suffered partial-thickness burns to their anterior right leg and anterior chest and abdomen as well as superficial burns to their right arm?", "options": ["18%", "27%", "36%", "45%"], "answer": "C", "answerText": "By the rule of nines the anterior and posterior trunk each account for 18%, each lower extremity 18%, and each upper extremity 9%; superficial (first-degree) burns should not be included when calculating burn size.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 8 Burns"}, {"id": "trauma-critical-care-512c8324", "topic": "Burns", "stem": "A 40-year-old woman is admitted to the burn unit after an industrial fire at a plastics manufacturing plant with burns to the face and arms. Her electrocardiogram (ECG) shows S-T elevation, and initial chemistry panel and arterial blood gas reveal an anion-gap metabolic acidosis with normal arterial carboxyhemoglobin. What is the most appropriate next step?", "options": ["Correction of acidosis by adding sodium bicarbonate to IV fluids", "Administration of 100% oxygen and hydroxocobalamin", "Transthoracic echocardiogram", "Blood culture with intravenous antibiotics"], "answer": "B", "answerText": "Cyanide inhibits cytochrome oxidase, causing persistent lactic acidosis and ST elevation; treatment consists of 100% oxygen and hydroxocobalamin, which quickly complexes with cyanide and is recommended for immediate therapy.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 8 Burns"}, {"id": "trauma-critical-care-0034f8b5", "topic": "Shock", "stem": "Shock caused by a large tension pneumothorax is categorized as:", "options": ["Traumatic shock", "Vasodilatory shock", "Cardiogenic shock", "Obstructive shock"], "answer": "D", "answerText": "Obstructive shock is a form of cardiogenic shock that results from mechanical impediment to circulation, such as pulmonary embolism or tension pneumothorax, leading to depressed cardiac output.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 5 Shock"}, {"id": "trauma-critical-care-06d17af4", "topic": "Shock", "stem": "Neurogenic shock is characterized by the presence of:", "options": ["Cool, moist skin", "Increased cardiac output", "Decreased peripheral vascular resistance", "Decreased blood volume"], "answer": "C", "answerText": "Neurogenic shock is caused by loss of arteriolar and venular tone and is characterized by decreased peripheral vascular resistance with warm, dry skin and a slower-than-normal pulse.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 5 Shock"}, {"id": "trauma-critical-care-91ab39f9", "topic": "Shock", "stem": "A patient has a blood pressure of 70/50 mm Hg and a serum lactate level of 30 mg/100 mL (normal: 6 to 16). Their cardiac output is 1.9 L/min, and his central venous pressure is 2 cm H2O. The most likely diagnosis is:", "options": ["Congestive heart failure", "Cardiac tamponade", "Hypovolemic shock", "Septic shock"], "answer": "C", "answerText": "The high lactate reflects anaerobic metabolism from decreased tissue perfusion, and the hemodynamic measurements indicate both low blood flow and low venous return, most consistent with hypovolemic shock.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 5 Shock"}, {"id": "trauma-critical-care-29386217", "topic": "Shock", "stem": "In hemorrhage, larger arterioles vasoconstrict in response to the sympathetic nervous system. Which categories of shock are associated with vasodilation of larger arterioles?", "options": ["Septic shock", "Cardiogenic shock", "Neurogenic shock", "A and C"], "answer": "D", "answerText": "Following hemorrhage larger arterioles vasoconstrict, but in the setting of sepsis or neurogenic shock these vessels vasodilate.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 5 Shock"}, {"id": "trauma-critical-care-7e2be09a", "topic": "Shock", "stem": "Chemoreceptors in the aorta and carotid bodies do NOT sense which of the following?", "options": ["Changes in O2 tension", "H+ ion concentration", "HCO3– concentration", "Carbon dioxide levels"], "answer": "C", "answerText": "Chemoreceptors in the aorta and carotid bodies are sensitive to changes in O2 tension, H+ ion concentration, and carbon dioxide levels, not HCO3– concentration.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 5 Shock"}, {"id": "trauma-critical-care-a36f3bb7", "topic": "Shock", "stem": "What is TRUE about baroreceptors?", "options": ["Volume receptors can be activated in hemorrhage with reduction in left atrial pressure", "Receptors in the aortic arch and carotid bodies inhibit the autonomic nervous system when stretched", "When baroreceptors are stretched, they induced increased autonomic nervous system output and produce constriction of peripheral vessels", "None of the above"], "answer": "B", "answerText": "Receptors in the aortic arch and carotid bodies normally inhibit induction of the autonomic nervous system; when activated by reduced stretch they diminish their output, disinhibiting sympathetic activation and producing peripheral vasoconstriction.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 5 Shock"}, {"id": "trauma-critical-care-0e5c7808", "topic": "Damage Control Surgery", "stem": "Which of the following is not part of damage control resuscitation (DCR)?", "options": ["Permissive hypotension", "Resuscitating with large volumes of crystalloid to limit RBC transfusion", "Immediate release and administration of a predefined ration of blood products to mimic whole blood", "Use of hemostatic adjuncts"], "answer": "B", "answerText": "DCR is composed of permissive hypotension, minimizing crystalloid-based resuscitation, immediate release of predefined balanced blood products in ratios similar to whole blood, and use of hemostatic adjuncts.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 4 Hemostasis, Surgical Bleeding, and Transfusion"}, {"id": "trauma-critical-care-e902cd72", "topic": "Damage Control Surgery", "stem": "In patients with significant blood loss, which of the following is incorrect?", "options": ["Resuscitation with whole blood", "Resuscitation with packed red blood cells, platelet, and FFP in a 1:1:1 ratio", "Packed red blood cells with transfusion of FFP and platelets as needed (when the measured INR > 2 and PLT# is <75,000)", "Resuscitation with crystalloid and artificial colloid to avoid transfusion reactions until hemorrhage is controlled"], "answer": "C", "answerText": "In the PROPPR trial the 1:1:1 group had significantly decreased mortality due to hemorrhage at 24 hours, and waiting for INR and platelet count thresholds appears to delay achieving hemostasis.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 4 Hemostasis, Surgical Bleeding, and Transfusion"}];</script><script src="../assets/quiz.js?v=c49484c0"></script>
