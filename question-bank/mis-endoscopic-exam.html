<main class="wrap page"><div><div class="crumbs"><a href="index.html">Question Bank</a> › <a href="mis-endoscopic.html">Minimally Invasive &amp; Endoscopic</a></div><article><h1>Minimally Invasive &amp; Endoscopic: Exam</h1></article><div id="quiz"></div></div></main><script>window.QUIZ_MODE="exam";window.QUIZ_CATEGORY="mis-endoscopic";window.QUIZ_DATA=[{"id": "mis-endoscopic-7e7684d5", "topic": "Laparoscopic Principles", "stem": "The most common arrhythmia seen during laparoscopy is:", "options": ["Atrial fibrillation", "Sinus tachycardia", "Premature ventricular contractions", "Sinus bradycardia"], "answer": "D", "answerText": "The most common arrhythmia created by laparoscopy is bradycardia, because rapid stretch of the peritoneal membrane often causes a vasovagal response with bradycardia and occasionally hypotension.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 14"}, {"id": "mis-endoscopic-afee1103", "topic": "Laparoscopic Principles", "stem": "A 23-year-old man presents to the emergency department with a 17-hour history of abdominal pain that started in the periumbilical region, now located in the RLQ, associated with fever, nausea, WBC 14,000, and imaging consistent with acute appendicitis. You consent the patient for a laparoscopic appendectomy. During initial insufflation of the abdomen the heart rate goes down to 36 and the patient becomes hypotensive. What is the best next step in the management of this patient?", "options": ["Give 1L of crystalloids", "Immediate IV atropine", "Desufflation of the abdomen", "Evaluate for hemorrhage"], "answer": "C", "answerText": "The appropriate management of this vasovagal event is desufflation of the abdomen, administration of vagolytic agents such as atropine, and adequate volume replacement.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 14"}, {"id": "mis-endoscopic-0c311618", "topic": "Laparoscopic Principles", "stem": "A patient undergoing laparoscopic colon resection is noted to have decreased urine output during the last hour of the case. A bolus is given at the end of the case. One hour later, there is still low urine output. The appropriate treatment is:", "options": ["Repeat bolus", "Intravenous (IV) furosemide", "Check urine electrolytes", "Observe"], "answer": "D", "answerText": "Hormonally mediated changes such as elevated antidiuretic hormone decrease urine output for up to 1 hour after the procedure, and intraoperative oliguria does not reflect intravascular volume status.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 14"}, {"id": "mis-endoscopic-142eebd5", "topic": "Laparoscopic Principles", "stem": "While performing a laparoscopic Nissen fundoplication, during the transhiatal dissection the mediastinal pleura is compromised and a CO2 pneumothorax develops. What is the initial preferred management of the pneumothorax?", "options": ["Needle thoracostomy over the second intercostal space, mid-clavicular line", "Enlargement of the defect and placement of an 18-French red rubber catheter across the defect", "Abort the procedure and emergent tube thoracostomy with a 28-French chest tube", "No intervention is needed. Continue with the planed procedure"], "answer": "B", "answerText": "When pneumothorax occurs during laparoscopic Nissen fundoplication or Heller myotomy, it is preferable to place an 18-French red rubber catheter with side holes across the defect and evacuate the pneumothorax to water seal at the end of the procedure.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 14"}, {"id": "mis-endoscopic-c369e8d2", "topic": "Laparoscopic Principles", "stem": "During pneumoperitoneum, the increased intra-abdominal pressure directly and indirectly results in:", "options": ["Increased renal blood flow", "Decreased urine output", "Decreased levels of renin", "Decreased sodium retention"], "answer": "B", "answerText": "Increased intra-abdominal pressure decreases renal blood flow, glomerular filtration rate, and urine output, and secondarily increases plasma renin release and sodium retention.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 14"}, {"id": "mis-endoscopic-8a524bea", "topic": "Laparoscopic Principles", "stem": "Which type of radiofrequency electrosurgery mode has the highest risk for thermal injury?", "options": ["Bipolar coagulation", "Monopolar coagulation", "Monopolar cutting", "Monopolar blended"], "answer": "B", "answerText": "Short-duration, high-voltage coagulation current provides extremely rapid tissue heating, whereas cutting current divides tissue with the least thermal injury and bipolar coaptation coagulates vessels without thermal injury to adjacent tissues.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 14"}, {"id": "mis-endoscopic-d72cb33a", "topic": "Laparoscopic Principles", "stem": "Which of the following are TRUE regarding safe laparoscopic surgery in pregnancy?", "options": ["The patient should be positioned slightly on the left lateral position", "Open abdominal access (Hasson) is recommended versus direct puncture laparoscopy (Veress needle)", "The surgery should be performed during the second trimester if possible", "All of the above"], "answer": "D", "answerText": "Most surgeons favor the open (Hasson) approach over direct puncture, and the patient should be positioned slightly on the left side to avoid compression of the vena cava by the uterus.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 14"}, {"id": "mis-endoscopic-0741bd69", "topic": "Robotic Surgery", "stem": "Which of the following represents advantages from robotic surgery compared to laparoscopic surgery?", "options": ["Increased dexterity", "Tremor elimination", "Scaling movement", "All of the above"], "answer": "D", "answerText": "The master-slave robotic platform returned the wrist to laparoscopic surgery and improved manual dexterity, with 3-D imaging, tremor elimination, and scaling of movement.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 14"}, {"id": "mis-endoscopic-099fa52d", "topic": "Robotic Surgery", "stem": "To date, what is the only surgery that has demonstrated better outcomes using robotic versus laparoscopic or open techniques?", "options": ["Nissen fundoplication", "Cholecystectomy", "Prostatectomy", "Roux-en-Y gastric bypass"], "answer": "C", "answerText": "Most minimally invasive urologists declared robotic prostatectomy preferable to laparoscopic and open prostatectomy, its great advantage being the ability to visualize and spare the pelvic nerves responsible for erectile function.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 14"}, {"id": "mis-endoscopic-b29facab", "topic": "Robotic Surgery", "stem": "A 73-year-old woman is seen in preoperative consultation for a cecal mass. You are counseling her on various approaches to a right hemicolectomy. Which of the following are benefits of minimally invasive colon resection, when compared to open surgery?", "options": ["Improved cosmetic results", "Decreased postoperative pain", "Earlier return of bowel function", "Less expensive", "All of the above", "A-C"], "answer": "F", "answerText": "Potential advantages of minimally invasive resection include improved cosmetic result, decreased postoperative pain, and earlier return of bowel function, but these advanced technologies are likely to be associated with significant cost.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 29"}, {"id": "mis-endoscopic-07e13551", "topic": "Robotic Surgery", "stem": "Robotic-assisted inguinal hernia repair:", "options": ["Does not decrease in cost as the volume increases at each center", "Cost of robotic and laparoscopic repairs converge as volume grows at each center", "Complications are likely to be less in obese patients compared to open repair", "Is less suited than laparoscopic repair for recurrent hernias"], "answer": "C", "answerText": "A retrospective covariate-matched study showed greatly reduced complication rates with robotic-assisted surgery in obese patients compared with open repair (3.2% vs 10.8%), and robotic cost decreases with center volume but is unlikely to converge with laparoscopic cost.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 37"}, {"id": "mis-endoscopic-dd74d702", "topic": "Endoscopic Hemostasis", "stem": "A 45-year-old man presents to the emergency department with emesis of bright red blood. Labs include HGB 10 g/dL, HCT 30%, platelets 300,000/mm3, INR 1.0, AST 30 U/L, ALT 45 U/L, and albumin 4.0 g/dL. After appropriate resuscitation, he undergoes esophagogastroduodenoscopy (EGD) which is notable for gastric varices. What is the appropriate treatment for his condition?", "options": ["Transjugular intrahepatic portosystemic shunt", "Variceal band ligation", "Splenorenal shunt", "Splenectomy"], "answer": "D", "answerText": "Bleeding gastric varices with normal liver function suggest splenic vein thrombosis, and portal hypertension secondary to splenic vein thrombosis is potentially curable with splenectomy.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 34"}];</script><script src="../assets/quiz.js?v=db194b4d"></script>
