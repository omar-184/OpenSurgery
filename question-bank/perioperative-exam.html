<main class="wrap page"><div><div class="crumbs"><a href="index.html">Question Bank</a> › <a href="perioperative.html">Perioperative &amp; Foundational</a></div><article><h1>Perioperative &amp; Foundational: Exam</h1></article><div id="quiz"></div></div></main><script>window.QUIZ_MODE="exam";window.QUIZ_DATA=[{"topic": "Preoperative Assessment", "stem": "The use of preoperative evaluation is associated with which of the following?", "options": ["Increased preoperative testing", "Decreased case cancellations", "Decreased time from clinic to surgery", "Decreased patient satisfaction"], "answer": "B", "answerText": "Use of a preoperative evaluation results in an 88% reduction in case cancellations, along with a 55% decrease in preoperative testing, reduced day-of-surgery delays, reduced length of stay, and lower in-hospital mortality.", "source": "Source: *Schwartz's ABSITE*, Ch. 50"}, {"topic": "Fluid and Electrolyte Management", "stem": "All of the following are possible causes of postoperative hyponatremia EXCEPT:", "options": ["Excess infusion of normal saline intraoperatively", "Administration of antipsychotic medication", "Transient decrease in antidiuretic hormone (ADH) secretion", "Excess oral water intake.  postoperatively, whereas excess free water intake and medications causing water retention are recognized causes of hyponatremia.)"], "answer": "C", "answerText": "ADH is released transiently (increased, not decreased", "source": "Source: *Schwartz's ABSITE*, Ch. 3"}, {"topic": "Fluid and Electrolyte Management", "stem": "Metabolic acidosis with a normal anion gap (AG) occurs with:", "options": ["Diabetic acidosis", "Renal failure", "Severe diarrhea", "Starvation"], "answer": "C", "answerText": "Normal-AG metabolic acidosis results from acid administration or bicarbonate loss from GI losses such as diarrhea or fistulas, the bicarbonate loss being accompanied by a chloride gain so the AG remains unchanged.", "source": "Source: *Schwartz's ABSITE*, Ch. 3"}, {"topic": "Fluid and Electrolyte Management", "stem": "Which of the following is an early sign of hyperkalemia?", "options": ["Peaked T waves", "Peaked P waves", "Peaked (shortened) QRS complex", "Peaked U waves"], "answer": "A", "answerText": "Peaked T waves are the early ECG change of hyperkalemia, followed by flattened P waves, prolonged PR interval, widened QRS, sine wave formation, and ventricular fibrillation.", "source": "Source: *Schwartz's ABSITE*, Ch. 3"}, {"topic": "Fluid and Electrolyte Management", "stem": "Water constitutes what percentage of total body weight?", "options": ["30%–40%", "40%–50%", "50%–60%", "60%–70%"], "answer": "C", "answerText": "Water constitutes approximately 50% to 60% of total body weight, the proportion reflecting body fat since lean tissues have higher water content.", "source": "Source: *Schwartz's ABSITE*, Ch. 3"}, {"topic": "Fluid and Electrolyte Management", "stem": "Fluid resuscitation using albumin:", "options": ["Is associated with coagulopathy", "Is available as 1% or 5% solutions", "Can lead to pulmonary edema", "Decreases factor XIII"], "answer": "C", "answerText": "Because of increased intravascular oncotic pressure drawing fluid into the intravascular space, albumin used for resuscitation of hypovolemic shock can lead to pulmonary edema; it is available as 5% or 25% solutions.", "source": "Source: *Schwartz's ABSITE*, Ch. 3"}, {"topic": "Fluid and Electrolyte Management", "stem": "The next most appropriate test to order in a patient with a pH of 7.1, Pco2 of 40, sodium of 132, potassium of 4.2, and chloride of 105 is:", "options": ["Serum bicarbonate", "Serum magnesium", "Serum ethanol", "Serum salicylate"], "answer": "A", "answerText": "In evaluating metabolic acidosis the first step is to measure the anion gap, AG = [Na] − [Cl + HCO3], which requires the serum bicarbonate.", "source": "Source: *Schwartz's ABSITE*, Ch. 3"}, {"topic": "Fluid and Electrolyte Management", "stem": "Which of the following statement is FALSE regarding hypertonic saline?", "options": ["It is an arteriolar vasodilator and may increase bleeding", "It should be avoided in closed head injury", "It should not be used for initial resuscitation", "It increases cerebral perfusion.  has actually been used in patients with closed head injuries, where it increases cerebral perfusion and decreases intracranial pressure and brain edema, though as an arteriolar vasodilator it raises bleeding concerns.)"], "answer": "B", "answerText": "Hypertonic saline (7.5%", "source": "Source: *Schwartz's ABSITE*, Ch. 3"}, {"topic": "Fluid and Electrolyte Management", "stem": "Normal saline is:", "options": ["135 mEq NaCl/L", "145 mEq NaCl/L", "148 mEq NaCl/L", "154 mEq NaCl/L"], "answer": "D", "answerText": "Normal saline is mildly hypertonic, containing 154 mEq of sodium balanced by 154 mEq of chloride, and the high chloride load may lead to hyperchloremic metabolic acidosis.", "source": "Source: *Schwartz's ABSITE*, Ch. 3"}, {"topic": "Fluid and Electrolyte Management", "stem": "Hypocalcemia may cause which of the following?", "options": ["Congestive heart failure", "Atrial fibrillation", "Pancreatitis", "Hypoparathyroidism"], "answer": "A", "answerText": "Severe hypocalcemia leads to decreased cardiac contractility and heart failure; hypoparathyroidism and severe pancreatitis are causes, not consequences, of hypocalcemia.", "source": "Source: *Schwartz's ABSITE*, Ch. 3"}, {"topic": "Fluid and Electrolyte Management", "stem": "If a patient's serum glucose increases by 180 mg/dL, what is the increase in serum osmolality, assuming all other laboratory values remain constant?", "options": ["Does not change", "8", "10", "12"], "answer": "C", "answerText": "Calculated serum osmolality = 2 × sodium + glucose/18 + BUN/2.8, so a 180 mg/dL rise in glucose increases osmolality by 10 mOsm.", "source": "Source: *Schwartz's ABSITE*, Ch. 3"}, {"topic": "Fluid and Electrolyte Management", "stem": "What is the actual potassium of a patient with pH of 7.8 and serum potassium of 2.2?", "options": ["2.2", "2.8", "3.2", "3.4"], "answer": "D", "answerText": "Potassium decreases by 0.3 mEq/L for every 0.1 increase in pH above normal, so at pH 7.8 the actual potassium is 2.2 + 1.2 = 3.4.", "source": "Source: *Schwartz's ABSITE*, Ch. 3"}, {"topic": "Fluid and Electrolyte Management", "stem": "The free water deficit of a 70-kg man with serum sodium of 154 is:", "options": ["0.1 L", "0.7 L", "1 L", "3.5 L  = TBW × (serum sodium − 140)/140, estimating TBW as 50% of lean body mass in men, which gives 35 × 14/140 = 3.5 L.)"], "answer": "D", "answerText": "Water deficit (L", "source": "Source: *Schwartz's ABSITE*, Ch. 3"}, {"topic": "Fluid and Electrolyte Management", "stem": "A patient with serum calcium of 6.8 and albumin of 1.2 has a corrected calcium of:", "options": ["7.7", "8.0", "8.6", "9.0"], "answer": "D", "answerText": "Total serum calcium is adjusted up by 0.8 mg/dL for every 1 g/dL decrease in albumin, so with albumin 1.2 the corrected calcium is about 9.0.", "source": "Source: *Schwartz's ABSITE*, Ch. 3"}, {"topic": "Fluid and Electrolyte Management", "stem": "All of the following treatments for hyperkalemia reduce serum potassium EXCEPT:", "options": ["Bicarbonate", "Kayexalate", "Glucose infusion with insulin", "Calcium"], "answer": "D", "answerText": "Calcium is given to counteract the myocardial effects of hyperkalemia but does not lower serum potassium, whereas glucose and bicarbonate shift potassium intracellularly and Kayexalate is a cation-exchange resin that binds it.", "source": "Source: *Schwartz's ABSITE*, Ch. 3"}, {"topic": "Fluid and Electrolyte Management", "stem": "The actual anion gap (AG) of a chronic alcoholic with Na 133, K 4, Cl– 101, HCO3– 22, albumin of 2.5 mg/dL is:", "options": ["6", "10", "14", "15. , giving 15.)"], "answer": "D", "answerText": "Because hypoalbuminemia reduces the AG, the estimated gap must be adjusted: corrected AG = actual AG + 2.5 × (4.5 − albumin", "source": "Source: *Schwartz's ABSITE*, Ch. 3"}, {"topic": "Surgical Site Infection", "stem": "During an elective cholecystectomy, a large bowel injury was caused during trochar placement without spillage of bowel contents into the abdomen. What class of surgical wound is this?", "options": ["Class I (Clean)", "Class II (Clean/contaminated)", "Class III (Contaminated)", "Class IV (Dirty)  wounds are those in which a hollow viscus with indigenous bacterial flora is opened under controlled circumstances without significant spillage of contents.)"], "answer": "B", "answerText": "Clean/contaminated (class II", "source": "Source: *Schwartz's ABSITE*, Ch. 6"}, {"topic": "Surgical Site Infection", "stem": "Which of the following factors does NOT influence the development of surgical site infections (SSIs)?", "options": ["Duration of procedure", "Degree of microbial contamination of the wound", "Malnutrition", "General anesthesia"], "answer": "D", "answerText": "SSI development is related to the degree of microbial contamination of the wound, the duration of the procedure, and host factors such as diabetes, malnutrition, obesity, and immune suppression — not general anesthesia.", "source": "Source: *Schwartz's ABSITE*, Ch. 6"}, {"topic": "Surgical Site Infection", "stem": "Which of the following are NOT TRUE?", "options": ["Postoperative hyperglycemia (>200) is associated with increased risk of wound infection", "Intraoperative hypothermia is associated with increased risk of wound infection", "High O2 levels during the surgery increases the risk of wound infection", "Hospitalized patients have a higher rate of wound infection.  during surgery that are associated with increased SSI rates, while hyperglycemia impairs white blood cell function and increases infection risk.)"], "answer": "C", "answerText": "It is hypothermia and hypoxia (not high oxygen levels", "source": "Source: *Schwartz's ABSITE*, Ch. 6"}, {"topic": "Surgical Site Infection", "stem": "Which of the following is NOT TRUE of necrotizing soft-tissue infections?", "options": ["Fifty percent are polymicrobial", "Elderly, immunosuppressed, and peripheral vascular disease patients have increased risk", "Can be treated with antibiotics alone", "Is a clinical diagnosis, suspected in patients with sepsis, skin changes or crepitus, and pain"], "answer": "C", "answerText": "Any of the clinical findings mandates immediate surgical intervention with incision, direct visualization of potentially infected tissue, and radical resection of affected areas; antibiotics alone are insufficient.", "source": "Source: *Schwartz's ABSITE*, Ch. 6"}, {"topic": "Surgical Site Infection", "stem": "Postoperative urinary tract infections:", "options": ["Are usually treated with a 7- to 10-day course of antibiotics", "Initial therapy should be directed by results of urine culture", "Are established by >10^4 CFU/mL of bacteria in urine culture in asymptomatic patients", "Can be reduced by irrigating indwelling Foley catheters daily"], "answer": "B", "answerText": "Initial therapy is directed by Gram stain results and refined as culture results become available; diagnosis requires >10^4 CFU/mL in symptomatic or >10^5 CFU/mL in asymptomatic patients, and treatment is 3 to 5 days of a single directed antibiotic.", "source": "Source: *Schwartz's ABSITE*, Ch. 6"}, {"topic": "Surgical Site Infection", "stem": "Indwelling intravascular catheters infections:", "options": ["Are not associated with duration of catheter use", "Single lumen and multilumen have similar infection rates", "Are always associated with purulence at the insertion site", "Can be asymptomatic, with rising white blood cells (WBCs) and positive blood culture"], "answer": "D", "answerText": "Many patients with intravascular catheter infections are asymptomatic, often exhibiting solely an elevated WBC count, with matching blood cultures from a peripheral site and the catheter raising suspicion.", "source": "Source: *Schwartz's ABSITE*, Ch. 6"}, {"topic": "Nutrition in Surgery", "stem": "Preoperative immunonutrition supplements provide greater quantities of which of the following as compared to preoperative standard oral supplements?", "options": ["Trace minerals", "Arachidonic acid", "Arginine", "Amino acids"], "answer": "C", "answerText": "Immunonutrition supplements have the addition of arginine to improve immunity and tissue repair, along with omega-3 fatty acids to mediate the inflammatory response.", "source": "Source: *Schwartz's ABSITE*, Ch. 50"}, {"topic": "Nutrition in Surgery", "stem": "Which of the following statements characterizes metabolism after injury and infection?", "options": ["An initial hypometabolic state following by a dramatic increase in energy expenditure at ~2 weeks", "Adipose stores within the body are the predominant energy source during critical illness", "Increased energy expenditure mediated by sympathetic activation and catecholamine release", "All of the above"], "answer": "D", "answerText": "After injury or infection there is an initial hypometabolic state followed by a rapid increase in energy expenditure at about 2 weeks, mediated by sympathetic activation and catecholamine release, with lipid the predominant energy source in critical illness.", "source": "Source: *Schwartz's ABSITE*, Ch. 2"}, {"topic": "Nutrition in Surgery", "stem": "What is an appropriate number of kcal and grams of protein per day for a 70-kg patient during a state of severe stress?", "options": ["2100 kcal, 70 g", "4200 kcal, 175 g", "3360 kcal, 140 g", "1925 kcal, 70 g  and 2 g/kg/day of protein, giving about 3360 kcal and 140 g for a 70-kg patient.)"], "answer": "C", "answerText": "For severe stress the appropriate calculation is 30–35 kcal/kg/day (a 1.6× adjustment above basal energy expenditure", "source": "Source: *Schwartz's ABSITE*, Ch. 2"}, {"topic": "Nutrition in Surgery", "stem": "Which of the following is NOT a reason that enteral nutrition is preferred to parenteral nutrition when possible?", "options": ["Lower cost of enteral feeding", "Lower risk of vascular access and infectious complications", "Fewer complications associated with gut disuse", "Improved immune response homeostasis"], "answer": "D", "answerText": "Enteral nutrition is preferred for its lower cost, lower risk of vascular access and infectious complications, and lower risk of gut-disuse complications, but there is no evidence of improved immune homeostasis with its use.", "source": "Source: *Schwartz's ABSITE*, Ch. 2"}, {"topic": "Nutrition in Surgery", "stem": "Refeeding syndrome can be associated with all of the following EXCEPT:", "options": ["Respiratory failure", "Hyperkalemia", "Confusion", "Cardiac arrhythmias. , so hyperkalemia is not a feature.)"], "answer": "B", "answerText": "With refeeding, the shift from fat to carbohydrate metabolism stimulates insulin release, causing cellular uptake of electrolytes (phosphate, magnesium, potassium, and calcium", "source": "Source: *Schwartz's ABSITE*, Ch. 3"}, {"topic": "Anesthesia Basics (Surgical Perspective)", "stem": "Malignant hyperthermia (MH) can develop after receiving general anesthesia. Which of the following represents a triggering agent?", "options": ["Nitrous Oxide", "Isoflurane", "Cisatracurium", "Rocuronium  and the depolarizing muscle relaxant succinylcholine, which raise myoplasmic calcium in susceptible patients.)"], "answer": "B", "answerText": "Triggering agents for MH include all volatile anesthetics (halothane, enflurane, isoflurane, sevoflurane, desflurane", "source": "Source: *Schwartz's ABSITE*, Ch. 45"}, {"topic": "Anesthesia Basics (Surgical Perspective)", "stem": "A sudden rise in end-tidal CO2 concentration from 11 to 37 mm Hg during cardiopulmonary resuscitation most likely represents which of the following?", "options": ["Adequate chest compressions", "Adequate respirations", "Return of spontaneous circulation", "Measurement artifact"], "answer": "C", "answerText": "A sudden rise in end-tidal CO2 during CPR most likely represents return of spontaneous circulation; a value of ≥10 mm Hg indicates adequate chest compressions.", "source": "Source: *Schwartz's ABSITE*, Ch. 46"}, {"topic": "Anesthesia Basics (Surgical Perspective)", "stem": "According to ACC/AHA guidelines, how long after bare metal coronary stent placement should elective surgery be delayed?", "options": ["30 days", "3 months", "6 months", "1 year"], "answer": "A", "answerText": "ACC/AHA guidelines recommend delaying elective surgery for 30 days after bare metal stent placement and for 1 year after drug-eluting stent placement.", "source": "Source: *Schwartz's ABSITE*, Ch. 46"}, {"topic": "Anesthesia Basics (Surgical Perspective)", "stem": "In patients who cannot be mask ventilated or intubated via direct laryngoscopy after induction of anesthesia, which of the following represents the best next step?", "options": ["Videolaryngoscopy", "Laryngeal mask airway insertion", "Fiberoptic intubation", "Surgical airway  airway insertion should be considered.)"], "answer": "B", "answerText": "Per the ASA difficult airway algorithm, when intubation attempts are unsuccessful and face mask ventilation is inadequate after induction, supraglottic (laryngeal mask", "source": "Source: *Schwartz's ABSITE*, Ch. 46"}, {"topic": "Anesthesia Basics (Surgical Perspective)", "stem": "A 34-year-old woman presents for elective hernia repair. According to American Society of Anesthesiologists (ASA) guidelines, after what interval from consumption of black coffee can anesthesia be induced in this patient?", "options": ["2 hours", "4 hours", "6 hours", "8 hours"], "answer": "A", "answerText": "Black coffee is a clear liquid, and preoperative fasting guidelines allow anesthesia to be induced 2 hours after intake of clear liquids.", "source": "Source: *Schwartz's ABSITE*, Ch. 46"}, {"topic": "Anesthesia Basics (Surgical Perspective)", "stem": "A patient presents for elective laparoscopic cholecystectomy. The patient reports a history of cardiac disease including a non-ST elevation MI 4 years prior that was treated with a drug-eluting stent. The patient reports being able to climb two flights of stairs. Which of the following BEST represents workup needed prior to induction of anesthesia?", "options": ["Electrocardiogram (EKG)", "Transthoracic echocardiography", "Stress nuclear perfusion imaging", "No further workup is needed"], "answer": "D", "answerText": "Patients able to perform 4 METs of exercise or more with stable coronary disease and good exercise tolerance can typically proceed to surgery without additional evaluation.", "source": "Source: *Schwartz's ABSITE*, Ch. 46"}, {"topic": "Anesthesia Basics (Surgical Perspective)", "stem": "Local anesthetic systemic toxicity can be treated by administration of which of the following?", "options": ["Sugammadex", "Neostigmine", "Flumazenil", "Lipid emulsion"], "answer": "D", "answerText": "In addition to treating symptomatology, local anesthetic systemic toxicity can be treated with intravenous administration of lipid emulsion.", "source": "Source: *Schwartz's ABSITE*, Ch. 46"}, {"topic": "Postoperative Complications", "stem": "The Sequential Organ Failure Assessment (SOFA) score:", "options": ["Includes AST and ALT", "An increase of score in ≥2 is correlated with 10% in-hospital mortality risk", "Does not depend on lab tests", "All of the above"], "answer": "B", "answerText": "An increase in SOFA score of ≥2 is correlated with a 10% in-hospital mortality risk; the score uses PaO2/FiO2 ratio, bilirubin, platelet count, MAP, GCS, creatinine, and urine output.", "source": "Source: *Schwartz's ABSITE*, Ch. 6"}, {"topic": "Postoperative Complications", "stem": "Sepsis incidence and survival in the United States are:", "options": ["Increasing incidence and decreased survival due to increasing age of the population", "Increased incidence with improved survival due to improvements in care, including Surviving Sepsis Campaign", "Decreasing incidence and improved survival due to proper use of perioperative antibiotics", "Improved survival is due to delay in starting antibiotics until source of sepsis is clear"], "answer": "B", "answerText": "Sepsis treatment has improved over the last decade with mortality dropping under 30%, driven by new evidence-based therapies and improved care delivery such as the Surviving Sepsis Campaign guidelines.", "source": "Source: *Schwartz's ABSITE*, Ch. 6"}, {"topic": "Wound Closure and Suturing Principles", "stem": "Normal wound healing is divided into phases defined by characteristic cellular populations and biochemical interactions. They are:", "options": ["Hemostasis and inflammation, proliferation, maturation, and remodeling", "Hemostasis, proliferation and inflammation, matrix deposition, maturation, and remodeling", "Hemostasis and inflammation, platelet aggregation, maturation and remodeling", "Hemostasis, inflammation, remodeling and maturation.  hemostasis and inflammation, (b) proliferation, and (c) maturation and remodeling.)"], "answer": "A", "answerText": "Normal wound healing is divided into (a", "source": "Source: *Schwartz's ABSITE*, Ch. 9"}, {"topic": "Wound Closure and Suturing Principles", "stem": "Which of the following is FALSE regarding polymorphonuclear neutrophils (PMNs) and their role in wound healing?", "options": ["PMNs release proteases that degrade ground substance within the wound site", "Neutrophils use fibrin clot generated at the wound as scaffolding for migration into the wound", "Neutrophil migration is stimulated by local prostaglandins, complement factors, IL-1, TNFα, GF-β, platelet factor 4, or bacterial products", "PMNs are the first cells to infiltrate the wound, peaking at 24 to 48 hours", "Neutrophils release cytokines that later assist with collagen deposition and epithelial closure"], "answer": "E", "answerText": "Other than limiting infection, neutrophils do not appear to play a role in collagen deposition or mechanical wound strength, and neutrophil factors have actually been implicated in delaying epithelial closure.", "source": "Source: *Schwartz's ABSITE*, Ch. 9"}, {"topic": "Wound Closure and Suturing Principles", "stem": "The proliferative phase of wound healing occurs how long after the injury?", "options": ["1 day", "2 days", "7 days", "14 days"], "answer": "C", "answerText": "The proliferative phase is the second phase of wound healing and roughly spans days 4 through 12, when tissue continuity is reestablished.", "source": "Source: *Schwartz's ABSITE*, Ch. 9"}, {"topic": "Wound Closure and Suturing Principles", "stem": "Which of the following is TRUE regarding the fibroplastic phase of wound healing?", "options": ["Early during wound healing, the predominant composition of the matrix is fibronectin and type II collagen", "After complete replacement of the scar with type III collagen, the mechanical strength will equal that of uninjured tissue approximately 6 to 12 months postinjury", "Even though the tensile strength of a wound reaches a plateau after several weeks, the tensile strength will increase over another 6 to 12 months due to fibril formation and cross-linking", "As the scar matures, matrix metalloproteinases break down type I collagen and replace it with type III collagen"], "answer": "C", "answerText": "By several weeks postinjury wound collagen content reaches a plateau, but tensile strength continues to increase for several more months through fibril formation and fibril cross-linking.", "source": "Source: *Schwartz's ABSITE*, Ch. 9"}, {"topic": "Wound Closure and Suturing Principles", "stem": "Dermal wounds in patients with Ehlers-Danlos syndrome (EDS) should be:", "options": ["Closed in one layer with sutures removed early to prevent deformity", "Closed in two layers, under tension, with sutures removed after twice as long time", "Allowed to heal by secondary intention, as would commonly fall apart", "There is no benefit to external fixation with adhesive tapes"], "answer": "B", "answerText": "In EDS, dermal wounds should be closed in two layers, approximated with the sutures under tension, and the stitches left in place twice as long as usual, with adhesive tape reinforcement helpful.", "source": "Source: *Schwartz's ABSITE*, Ch. 9"}, {"topic": "Wound Closure and Suturing Principles", "stem": "The most common causes of Ehler-Danlos syndrome are:", "options": ["An acquired collagen deficit", "Genetic defects encoding α-chains of collagen type V", "Genetic defect in platelet-derived growth factor (PDGF)", "Type I and type III collagen genetic defect"], "answer": "B", "answerText": "Over half of affected EDS patients manifest genetic defects encoding α-chains of collagen type V, causing it to be either quantitatively or structurally defective.", "source": "Source: *Schwartz's ABSITE*, Ch. 9"}, {"topic": "Wound Closure and Suturing Principles", "stem": "Patients with Marfan syndrome are associated with what genetic defect?", "options": ["MFN-1 gene deletion", "Type I collagen gene mutation", "COL7A1 gene mutation", "FBN-1 gene mutation"], "answer": "D", "answerText": "The genetic defect associated with Marfan syndrome is a mutation in the FBN-1 gene, which encodes for fibrillin.", "source": "Source: *Schwartz's ABSITE*, Ch. 9"}];</script><script src="../assets/quiz.js?v=78cc0e52"></script>
