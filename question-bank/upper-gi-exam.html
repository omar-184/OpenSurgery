<main class="wrap page"><div><div class="crumbs"><a href="index.html">Question Bank</a> › <a href="upper-gi.html">Upper Gastrointestinal</a></div><article><h1>Upper Gastrointestinal: Exam</h1></article><div id="quiz"></div></div></main><script>window.QUIZ_MODE="exam";window.QUIZ_DATA=[{"topic": "GERD and Hiatal Hernia", "stem": "The antireflux mechanism is composed of the following EXCEPT:", "options": ["A mechanically effective lower esophageal sphincter (LES)", "Efficient esophageal clearance", "An adequately functioning gastric reservoir", "Secondary peristalsis", "Intact vagal function"], "answer": "D", "answerText": "The antireflux mechanism is composed of three components: a mechanically effective LES, efficient esophageal clearance, and an adequately functioning gastric reservoir.", "source": "Source: *Schwartz's ABSITE*, Ch. 25"}, {"topic": "GERD and Hiatal Hernia", "stem": "The most direct method of measuring gastric juice exposure in the esophagus is:", "options": ["Esophageal motility study", "High resolution manometry", "24-hour ambulatory pH monitoring", "Esophageal impedance", "Esophageal transit scintigraphy"], "answer": "C", "answerText": "The most direct method of measuring increased esophageal exposure to gastric juice is an indwelling pH electrode, i.e., 24-hour ambulatory pH monitoring.", "source": "Source: *Schwartz's ABSITE*, Ch. 25"}, {"topic": "GERD and Hiatal Hernia", "stem": "What is the correct order in the stepwise approach in treatment for gastroesophageal reflux disease (GERD)?", "options": ["PPI->endoscopy->24-hour pH study->surgery", "Endoscopy->PPI->24-hour pH study->surgery", "PPI->24-hour pH study->endoscopy->surgery", "24-hour pH study->endoscopy->PPI->surgery. ; failure prompts endoscopy to assess mucosal injury, and 24-hour pH measurement is undertaken when patients are considered for surgery.)"], "answer": "A", "answerText": "First-line therapy is antisecretory medication (PPI", "source": "Source: *Schwartz's ABSITE*, Ch. 25"}, {"topic": "GERD and Hiatal Hernia", "stem": "An antireflux surgery should ideally do all of the following EXCEPT:", "options": ["Create a flap valve to prevent regurgitation into the esophagus", "Double the resting gastric pressure", "Reconstruct the valve to a length <3 cm", "Create a loose wrap", "Maintain the position of the gastric fundus close to the distal esophagus"], "answer": "C", "answerText": "With all types of fundoplication the length of the reconstructed valve should be at least 3 cm, which augments sphincter characteristics and prevents unfolding with gastric distention.", "source": "Source: *Schwartz's ABSITE*, Ch. 25"}, {"topic": "GERD and Hiatal Hernia", "stem": "What is the characterization of a rolling or type II paraesophageal hernia?", "options": ["Upward dislocation of the colon in the posterior mediastinum", "Upward dislocation of both the cardia and gastric fundus in the posterior mediastinum", "Upward dislocation of the gastric fundus in the posterior mediastinum", "Upward dislocation of the cardia in the posterior mediastinum"], "answer": "C", "answerText": "The rolling or type II paraesophageal hernia is characterized by upward dislocation of the gastric fundus alongside a normally positioned cardia.", "source": "Source: *Schwartz's ABSITE*, Ch. 25"}, {"topic": "GERD and Hiatal Hernia", "stem": "On upper endoscopy, a patient is found to have erosions in the esophagus limited to the mucosal folds that are >5 mm in longitudinal extent. What classification does he fall under according to the Los Angeles (LA) grading system?", "options": ["Grade", "", "Grade", "", "Grade", "", "Grade", "", "Grade E"], "answer": "B", "answerText": "LA grade B is one or more erosions limited to the mucosal folds that are greater than 5 mm in longitudinal extent.", "source": "Source: *Schwartz's ABSITE*, Ch. 25"}, {"topic": "Peptic Ulcer Disease", "stem": "All of the following statements about complicated peptic ulcer disease requiring hospitalization are TRUE EXCEPT:", "options": ["Bleeding is the most common cause of ulcer-related death", "Perforation is the most common indication for operation", "Endoscopic treatment is usually effective in achieving definitive hemostasis", "Obstruction rarely requires operation"], "answer": "D", "answerText": "Most patients with significant obstruction from chronic ulceration require substantial intervention; endoscopic balloon dilation often fails and patients ultimately come to operation.", "source": "Source: *Schwartz's ABSITE*, Ch. 26"}, {"topic": "Peptic Ulcer Disease", "stem": "Which of the following inhibits gastrin secretion?", "options": ["Histamine", "Acetylcholine", "Amino acids", "Acid"], "answer": "D", "answerText": "Luminal acid is the most potent inhibitor of gastrin secretion, an effect predominantly mediated by somatostatin released from antral D cells.", "source": "Source: *Schwartz's ABSITE*, Ch. 26"}, {"topic": "Peptic Ulcer Disease", "stem": "Eradication of Helicobacter pylori infection after treatment may be confirmed by all of the following EXCEPT:", "options": ["Carbon-labeled urea breath test", "Serology", "Fecal antigen test", "Gastric mucosal biopsy"], "answer": "B", "answerText": "A positive serology persists after eradication of H. pylori, so serology is not useful to confirm successful treatment.", "source": "Source: *Schwartz's ABSITE*, Ch. 26"}, {"topic": "Peptic Ulcer Disease", "stem": "A patient is referred 2 years following distal gastrectomy and Roux-en-Y reconstruction for nonhealing benign gastric ulcer. His chief complaint is epigastric pain relieved by vomiting undigested food. He has lost 15% of his body weight in the past 6 months. Solid gastric emptying scan shows 20% gastric emptying at 4 hours, and upper endoscopy is normal except for retained food in the stomach. Treatment options include all the following EXCEPT:", "options": ["Transthoracic vagotomy", "Oral erythromycin", "High subtotal gastrectomy", "Feeding jejunostomy.  or total gastrectomy with Roux-en-Y reconstruction — vagotomy is not a treatment.)"], "answer": "A", "answerText": "Once mechanical obstruction is ruled out, gastric stasis is treated with dietary modification and promotility agents, and if operation is required, near-total (95%", "source": "Source: *Schwartz's ABSITE*, Ch. 26"}, {"topic": "Peptic Ulcer Disease", "stem": "Which of the following is secreted by gastric parietal cells?", "options": ["Pepsinogen", "Intrinsic factor", "Gastrin-releasing peptide", "Ghrelin", "Histamine"], "answer": "B", "answerText": "Activated parietal cells secrete intrinsic factor in addition to hydrochloric acid; intrinsic factor binds luminal vitamin B12 for absorption in the terminal ileum.", "source": "Source: *Schwartz's ABSITE*, Ch. 26"}, {"topic": "Peptic Ulcer Disease", "stem": "The most accurate diagnostic test for Zollinger-Ellison syndrome (ZES) is:", "options": ["Fasting serum gastrin", "Computed tomography scan", "Endoscopy", "Secretin stimulation test"], "answer": "D", "answerText": "The diagnosis of ZES is confirmed by the secretin stimulation test, in which an increase in serum gastrin of 200 pg/mL or greater suggests gastrinoma.", "source": "Source: *Schwartz's ABSITE*, Ch. 26"}, {"topic": "Peptic Ulcer Disease", "stem": "A patient on chronic steroids and nonsteroidal anti-inflammatory drugs (NSAIDs) for rheumatoid arthritis requires operation for bleeding duodenal ulcer. Patients like this:", "options": ["Have a 90-day mortality risk of 5%", "Far outnumber patients requiring operation for perforated duodenal ulcer", "Should be considered for lifelong acid suppression if vagotomy is omitted", "Are usually treated with distal gastrectomy"], "answer": "C", "answerText": "Long-term maintenance PPI therapy should be considered in all patients admitted with ulcer complications and all high-risk patients on NSAIDs or aspirin.", "source": "Source: *Schwartz's ABSITE*, Ch. 26"}, {"topic": "Peptic Ulcer Disease", "stem": "In the patient with a secretin stimulation test suggesting gastrinoma, which of the following is the preoperative imaging study of choice?", "options": ["Computed tomography (CT)", "Magnetic resonance imaging (MRI)", "Endoscopic ultrasound (EUS)", "Angiographic localization", "Somatostatin receptor scintigraphy.  is sensitive and specific when the pretest probability of gastrinoma is high and may identify regional or distant metastatic disease.)"], "answer": "E", "answerText": "Somatostatin receptor scintigraphy (octreotide scan", "source": "Source: *Schwartz's ABSITE*, Ch. 26"}, {"topic": "Peptic Ulcer Disease", "stem": "A 50-year-old homeless man is brought to the emergency room (ER) complaining of 2 days of severe abdominal pain. He states that he \"has had ulcer trouble for 30 years.\" Temp = 102°F, BP = 80/50, P = 130. He has abdominal distention and generalized peritonitis on examination. Serum lactate is elevated. He is given intravenous (IV) antibiotics and 2 L of crystalloid then started on norepinephrine drip. Nasogastric (NG) drains 300 mL of bilious nonbloody fluid. Computed tomography (CT) scan immediately after injection of 100 mL oral contrast via NG shows extravasation from the duodenal bulb, copious-free peritoneal fluid, and air. BP is now 110/70, serum lactate is normal, and urine output in the past hour is 20 mL. You strongly suspect perforated duodenal ulcer and you would recommend:", "options": ["Endoscopy and biopsy", "Immediate closure of perforation with Graham patch", "Nonoperative management", "Immediate closure of perforation with definitive ulcer operation", "An additional 8 hours of ICU resuscitation, followed by laparoscopic patch and highly selective vagotomy"], "answer": "B", "answerText": "Simple patch closure is the procedure of choice in patients with hemodynamic instability and/or exudative peritonitis signifying a perforation more than 24 hours old.", "source": "Source: *Schwartz's ABSITE*, Ch. 26"}, {"topic": "Peptic Ulcer Disease", "stem": "Which of the following options is the least preferable reconstruction for patients undergoing antrectomy for peptic ulcer disease?", "options": ["Bilroth I", "Bilroth II", "Roux-en-Y gastrojejunostomy", "All are equally preferable"], "answer": "C", "answerText": "Because antrectomy routinely leaves a 60% to 70% gastric remnant, Roux-en-Y reconstruction predisposes to marginal ulceration and/or gastric stasis and should be avoided.", "source": "Source: *Schwartz's ABSITE*, Ch. 26"}, {"topic": "Gastric Cancer", "stem": "A 78-year-old man with good functional status undergoes evaluation for a newly diagnosed focal antral gastric cancer including cross-sectional imaging, endoscopic ultrasound, and diagnostic laparoscopy. Studies indicate a T2N0 tumor. The least appropriate treatment approach is:", "options": ["Subtotal D2 gastrectomy alone", "Subtotal D2 gastrectomy followed by chemotherapy", "Initial systemic therapy followed by subtotal D2 gastrectomy", "Subtotal gastrectomy with removal and assessment of >16 regional lymph nodes and adjuvant chemoradiotherapy", "Endoscopic resection"], "answer": "E", "answerText": "T2 tumors are not well treated with endoscopic resection given a prohibitive risk of recurrence.", "source": "Source: *Schwartz's ABSITE*, Ch. 26"}, {"topic": "Gastric Cancer", "stem": "Which of the following is not TRUE of hereditary diffuse gastric cancer (HDGC)?", "options": ["It is associated with a mutation in the E-cadherin gene", "Lifetime risk of gastric cancer in affected women is greater than in men", "It is associated with an increased risk of lobular breast cancer", "Presentation with clinically significant gastric cancer is associated with a very poor prognosis"], "answer": "B", "answerText": "The lifetime risk of gastric cancer in HDGC is approximately 70% in men and 56% in women, so risk is not greater in women.", "source": "Source: *Schwartz's ABSITE*, Ch. 26"}, {"topic": "Gastric Cancer", "stem": "The most common premalignant condition for early gastric cancer is:", "options": ["Gastric adenoma", "Chronic ulcer", "Hamartomatous polyp", "Atrophic gastritis"], "answer": "D", "answerText": "By far the most common precancerous lesion is atrophic gastritis, which may progress through intestinal metaplasia and dysplasia to gastric cancer.", "source": "Source: *Schwartz's ABSITE*, Ch. 26"}, {"topic": "Gastric Cancer", "stem": "A patient presents with gastric cancer diagnosed on endoscopy performed for weight loss and abdominal fullness. Cross-sectional imaging shows a diffusely thickened stomach with regional adenopathy. There is no evidence of distant metastatic disease. Initial management should include:", "options": ["Diagnostic laparoscopy with peritoneal lavage", "Consideration of enteral access for nutrition support", "Systemic chemotherapy", "Total gastrectomy", "A, B, and C"], "answer": "E", "answerText": "Diagnostic laparoscopy with peritoneal lavage, enteral access for nutrition support, and initiation of systemic chemotherapy are all appropriate initial steps, as total gastrectomy is not a pressing priority in linitis plastica-type disease.", "source": "Source: *Schwartz's ABSITE*, Ch. 26"}, {"topic": "Gastric Cancer", "stem": "In the patient with a normal liver and endoscopic diagnosis of watermelon stomach (gastric antral vascular ectasia [GAVE]), chronic blood loss requiring multiple transfusions is best treated by:", "options": ["Proton pump inhibitors and Carafate", "Beta blockers", "Distal gastrectomy", "Total gastrectomy.  may be required to control blood loss from GAVE, which predominantly affects the distal stomach, and is quite effective.)"], "answer": "C", "answerText": "Antrectomy (distal gastrectomy", "source": "Source: *Schwartz's ABSITE*, Ch. 26"}, {"topic": "Gastric Cancer", "stem": "Which of the following options is the best initial management of a low-grade mucosa-associated lymphoid tissue (MALT) lymphoma of the gastric antrum?", "options": ["Helicobacter pylori eradication", "Chemotherapy +/– radiation therapy", "Wedge resection", "Antrectomy"], "answer": "A", "answerText": "When H. pylori is eradicated and the gastritis improves, the low-grade MALT lymphoma often disappears; it is not a surgical lesion.", "source": "Source: *Schwartz's ABSITE*, Ch. 26"}, {"topic": "Gastric Cancer", "stem": "Type III gastric carcinoid tumors:", "options": ["Often do not require resection", "Are associated with hypergastrinemia", "Are sporadic lesions", "Have better outcomes than type I and II tumors"], "answer": "C", "answerText": "Type III gastric neuroendocrine tumors are sporadic, usually solitary lesions >2 cm, and are not associated with hypergastrinemia.", "source": "Source: *Schwartz's ABSITE*, Ch. 26"}, {"topic": "Gastric Cancer", "stem": "A fifty-year-old man undergoes resection of a 5 cm gastrointestinal stromal tumor (GIST) involving the fundus of the stomach. Pathology indicates 12 mitoses/50 HPF. Molecular testing shows a KIT mutation. Subsequent management should include:", "options": ["Clinical follow-up alone", "Clinical follow-up with periodic surveillance imaging alone", "Adjuvant Imatinib for 1 year", "Adjuvant Sunitinib for at least 3 years", "Adjuvant Imatinib for at least 3 years"], "answer": "E", "answerText": "Mitotic rate >5/50 HPF is the strongest predictor of recurrence, and adjuvant imatinib for 3 years proved superior to 1 year in the Scandinavian Sarcoma Group XVIII trial.", "source": "Source: *Schwartz's ABSITE*, Ch. 26"}, {"topic": "Achalasia", "stem": "Which of the following disorders involves simultaneous nonperistaltic contractions of the esophagus?", "options": ["Achalasia", "Diffuse esophageal spasm (DES)", "Hypertensive lower esophageal sphincter", "Nutcracker esophagus"], "answer": "B", "answerText": "DES is characterized manometrically by frequent simultaneous waveforms and multipeaked esophageal contractions, with some peristaltic waveforms preserved in excess of achalasia.", "source": "Source: *Schwartz's ABSITE*, Ch. 25"}, {"topic": "Achalasia", "stem": "Patients who present with achalasia should NOT be offered which of the following treatment options?", "options": ["Heller myotomy with 270° Belsey fundoplication", "Heller myotomy with Toupet posterior 180° fundoplication", "Heller myotomy with Dor anterior 180° fundoplication", "Heller myotomy with complete 360° fundoplication"], "answer": "D", "answerText": "If an antireflux procedure is added to esophageal myotomy, a complete 360° fundoplication should be avoided in favor of a partial wrap to prevent long-term esophageal dysfunction from outflow obstruction.", "source": "Source: *Schwartz's ABSITE*, Ch. 25"}, {"topic": "Esophageal Cancer", "stem": "The preoperative test most heavily correlated with the ability to tolerate an esophagectomy is:", "options": ["DLCO", "FEV1", "Ability to climb 1 flight of stairs", "FVC. , which ideally should be 2 L or more; FEV1 <1.25 L carries a 40% risk of dying from respiratory insufficiency within 4 years.)"], "answer": "B", "answerText": "Respiratory function is best assessed with the forced expiratory volume in 1 second (FEV1", "source": "Source: *Schwartz's ABSITE*, Ch. 25"}, {"topic": "Esophageal Cancer", "stem": "Which of the following tests most accurately assesses the T stage of esophageal cancer?", "options": ["High-resolution CT scan", "Magnetic resonance imaging (MRI)", "Echocardiography", "Endoscopic ultrasound (EUS)", "Esophagogastroduodenoscopy"], "answer": "D", "answerText": "EUS provides the most reliable method of determining depth of cancer invasion.", "source": "Source: *Schwartz's ABSITE*, Ch. 25"}, {"topic": "Esophageal Cancer", "stem": "Which of the following patients would not be considered a candidate for esophagectomy?", "options": ["A 55-year-old man with gastroesophageal junction (GEJ) adenocarcinoma confined to the muscularis mucosa", "A 47-year-old woman with mid-esophageal cancer and an involved cervical lymph node (LN)", "A 60-year-old man with a large GEJ carcinoma with invasion into the pleura without a malignant effusion", "A 70-year-old woman with a small GEJ cancer and three pathologic LNs nearby on EUS.  can still be considered for resection in the absence of a malignant effusion.)"], "answer": "B", "answerText": "Mid-esophageal cancer with an involved cervical lymph node is not a candidate, whereas invasion into the pleura (T4a", "source": "Source: *Schwartz's ABSITE*, Ch. 25"}, {"topic": "Esophageal Cancer", "stem": "Patients with dysphagia secondary to esophageal cancer treated with radiation can expect the benefit to last:", "options": ["<1 month", "2–3 months", "6–12 months", ">12 months"], "answer": "B", "answerText": "Radiation alone is used for palliation of dysphagia but the benefit is short-lived, lasting only 2 to 3 months.", "source": "Source: *Schwartz's ABSITE*, Ch. 25"}, {"topic": "Esophageal Cancer", "stem": "Squamous cell carcinomas of the esophagus most commonly occur:", "options": ["At the gastroesophageal junction", "In the cervical and upper thoracic esophagus", "In the lower thoracic esophagus", "Evenly distributed throughout the esophagus"], "answer": "B", "answerText": "Tumors of the cervical esophagus are almost always squamous cell cancers, which predominate in the cervical and upper thoracic esophagus.", "source": "Source: *Schwartz's ABSITE*, Ch. 25"}, {"topic": "Esophageal Cancer", "stem": "The incidence of metaplastic Barrett esophagus (BE) progressing to adenocarcinoma is:", "options": ["<0.1% per year", "0.2% to 0.5% per year", "1% to 3% per year", "3% to 5% per year", ">5% per year"], "answer": "B", "answerText": "The incidence of metaplastic Barrett epithelium becoming dysplastic and progressing to adenocarcinoma is approximately 0.2% to 0.5% per year.", "source": "Source: *Schwartz's ABSITE*, Ch. 25"}, {"topic": "Esophageal Cancer", "stem": "The histologic hallmark of Barrett esophagus (BE) is:", "options": ["Columnar epithelium", "Goblet cells", "Parietal cells", "Cuboidal epithelium"], "answer": "B", "answerText": "The hallmark of the intestinal metaplasia that defines Barrett esophagus is the presence of intestinal goblet cells.", "source": "Source: *Schwartz's ABSITE*, Ch. 25"}, {"topic": "Esophageal Cancer", "stem": "Clinical factors that are poor prognosticators in esophageal cancer and exclude surgery for curative intent include the following EXCEPT:", "options": ["Recurrent nerve paralysis", "Horner syndrome", "Persistent spinal pain", "Malignant pleural effusion", "Hematemesis"], "answer": "E", "answerText": "Clinical factors excluding surgery with curative intent are recurrent nerve paralysis, Horner syndrome, persistent spinal pain, diaphragm paralysis, fistula formation, and malignant pleural effusion — not hematemesis.", "source": "Source: *Schwartz's ABSITE*, Ch. 25"}, {"topic": "Esophageal Cancer", "stem": "The top three most common complications (in order of most common to least common) following an minimally invasive surgery (MIS) three-field esophagectomy are:", "options": ["Pneumonia, atrial fibrillation, anastomotic leak", "Anastomotic leak, pneumonia, deep vein thrombosis (DVT)", "Atrial fibrillation, thoracic duct injury, pneumonia", "Pneumonia, anastomotic leak, pneumothorax", "Atrial fibrillation, anastomotic leak, pneumonia"], "answer": "A", "answerText": "In many series the most common complication is pneumonia, the second is atrial fibrillation, and the third is anastomotic leak.", "source": "Source: *Schwartz's ABSITE*, Ch. 25"}, {"topic": "Esophageal Cancer", "stem": "A characteristic finding on Barium swallow for eosinophilic esophagitis (EE) is:", "options": ["Feline esophagus", "Apple core esophagus", "Bird's beak esophagus", "Rat's tail esophagus"], "answer": "A", "answerText": "EE has a characteristic \"ringed\" or \"feline\" esophagus appearance on barium swallow, as the esophageal rings are felt to look like the stripes on a housecat.", "source": "Source: *Schwartz's ABSITE*, Ch. 25"}, {"topic": "Zenker's Diverticulum", "stem": "Patients who undergo diverticulopexy, instead of diverticulectomy, for treatment of Zenker's diverticulum have a lower risk of:", "options": ["Fistula formation", "Hematoma", "Recurrent nerve paralysis", "Difficulties in phonation", "Horner's syndrome.  can be reduced by performing a diverticulopexy rather than diverticulectomy.)"], "answer": "A", "answerText": "The incidence of fistula formation (and abscess", "source": "Source: *Schwartz's ABSITE*, Ch. 25"}, {"topic": "Boerhaave Syndrome / Esophageal Perforation", "stem": "Following a night of heavy drinking, a 43-year-old otherwise healthy man has sudden onset of severe chest pain after vomiting. Esophagram confirms esophageal rupture just proximal to the GEJ. What is the preferred operative exposure?", "options": ["Right thoracotomy", "Right thoracotomy with laparotomy", "Left thoracotomy", "Left thoracotomy with laparotomy", "Midline laparotomy"], "answer": "C", "answerText": "The most common location of the injury is the left lateral wall of the esophagus just above the GEJ, exposed via left thoracotomy with primary closure reinforced by a pleural patch or fundoplication.", "source": "Source: *Schwartz's ABSITE*, Ch. 25"}, {"topic": "Bariatric Surgery", "stem": "What body mass index [BMI or wt (kg)/height (m2)] definition of obesity serves as the standard indication for bariatric surgery when medical therapy has failed and comorbid conditions exist?", "options": ["Overweight (BMI 25.0–29.9)", "Class I obesity (BMI 30.0–34.9)", "Class II obesity (BMI 35.0-39.9)", "Class III obesity (BMI ≥ 40)"], "answer": "C", "answerText": "The 1991 NIH Consensus Conference recommended bariatric surgery for BMI 35.0 to 39.9 when medical therapy has failed and comorbid conditions exist; without comorbidity a BMI ≥40 is required.", "source": "Source: *Schwartz's ABSITE*, Ch. 27"}, {"topic": "Bariatric Surgery", "stem": "Which of the following bariatric procedures is primarily intended to induce weight loss through malabsorption of ingested nutrients?", "options": ["Jejunoileal bypass", "Sleeve gastrectomy", "Roux-en-Y gastric bypass", "Duodenal switch"], "answer": "A", "answerText": "Malabsorptive operations include the jejunoileal bypass and its derivatives, whereas band and sleeve are restrictive and RYGB is combined restrictive-malabsorptive.", "source": "Source: *Schwartz's ABSITE*, Ch. 27"}, {"topic": "Bariatric Surgery", "stem": "Complications of adjustable gastric banding which have diminished its popularity as a bariatric procedure include all of the following EXCEPT:", "options": ["Mortality risk", "Slippage of the band", "Failure to lose weight", "Port and tubing complications"], "answer": "A", "answerText": "The adjustable gastric band has the lowest cost and mortality risk of all bariatric procedures; slippage, erosion, and port complications, plus poor weight loss, diminished its popularity.", "source": "Source: *Schwartz's ABSITE*, Ch. 27"}, {"topic": "Bariatric Surgery", "stem": "Early postoperative complications after a Roux-en-Y gastric bypass (RYGB) procedure include all of the following EXCEPT:", "options": ["Hematemesis", "Dilation of the distal gastric remnant", "Pulmonary embolus", "Hyperglycemia"], "answer": "D", "answerText": "Diabetes, if present, usually improves promptly after RYGB and hyperglycemia is unlikely to be problematic.", "source": "Source: *Schwartz's ABSITE*, Ch. 27"}, {"topic": "Bariatric Surgery", "stem": "Small bowel obstruction after Roux-en-Y gastric bypass (RYGB) should be treated as an urgent surgical emergency because:", "options": ["It is frequently due to an incarcerated internal hernia which can progress to bowel necrosis and perforation", "Abdominal distension risks disruption of suture lines", "Signs and symptoms of peritonitis, such as pain, fever, and leukocytosis, are usually masked in the obese", "Nasogastric intubation will not decompress the distal gastric remnant"], "answer": "A", "answerText": "SBO after RYGB is frequently due to an incarcerated internal hernia at the mesenteric defect, which can progress rapidly to strangulation, necrosis, and perforation.", "source": "Source: *Schwartz's ABSITE*, Ch. 27"}, {"topic": "Bariatric Surgery", "stem": "A late complication of Roux-en-Y gastric bypass is the development of post-gastric bypass hypoglycemia (PGBH) due to inappropriately elevated insulin levels. Recommended treatments of this condition include all of the following EXCEPT:", "options": ["Very low carbohydrate diet", "Anti-secretory agents such as diazoxide and somatostatin", "GLP-1 receptor antagonists", "Pancreatic resection"], "answer": "D", "answerText": "Pancreatic resection is no longer recommended: partial pancreatectomy results in recurrence, and total pancreatectomy exchanges one severe condition for another.", "source": "Source: *Schwartz's ABSITE*, Ch. 27"}, {"topic": "Bariatric Surgery", "stem": "Complications which are associated with the gastric sleeve procedure include:", "options": ["Leak from the gastric staple line", "Gastroesophageal reflux", "Stenosis of the gastric sleeve", "All of the above"], "answer": "D", "answerText": "The high-pressure gastric tube places the staple line at risk of leak, increases the probability of gastroesophageal reflux, and stenosis of the sleeve may occur.", "source": "Source: *Schwartz's ABSITE*, Ch. 27"}, {"topic": "Bariatric Surgery", "stem": "In addition to the effects of weight loss, the resolution of type 2 diabetes mellitus after the gastric sleeve procedure and Roux-en-Y gastric bypass (RYGB) is thought to be contributed to by:", "options": ["Reduced ghrelin production", "Increased secretion of GLP-1", "Appetite suppression", "All of the above"], "answer": "D", "answerText": "Removal of the ghrelin-producing stomach, dramatically increased GLP-1 secretion, and profound appetite suppression all contribute to diabetes resolution.", "source": "Source: *Schwartz's ABSITE*, Ch. 27"}, {"topic": "Bariatric Surgery", "stem": "Adolescent patients with morbid obesity are increasingly being referred for consideration of bariatric procedures due to failure of medical management and the risks associated with a lifetime of obesity. What nutritional deficiencies require lifelong treatment after Roux-en-Y gastric bypass (RYGB), the most common procedure performed in this age group?", "options": ["Pernicious anemia due to vitamin B12 deficiency", "Iron deficiency anemia", "Deficiencies of vitamins A, E, D, and K", "All of the above. , impaired iron absorption, and fat-soluble vitamin deficiency all present lifelong risks after RYGB, mandating vitamin replacement and monitoring.)"], "answer": "D", "answerText": "Loss of intrinsic factor (vitamin B12", "source": "Source: *Schwartz's ABSITE*, Ch. 27"}];</script><script src="../assets/quiz.js?v=78cc0e52"></script>
