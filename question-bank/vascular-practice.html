<main class="wrap page"><div><div class="crumbs"><a href="index.html">Question Bank</a> › <a href="vascular.html">Vascular</a></div><article><h1>Vascular: Practice</h1></article><div id="quiz"></div></div></main><script>window.QUIZ_MODE="practice";window.QUIZ_CATEGORY="vascular";window.QUIZ_DATA=[{"id": "vascular-e2ecb89f", "topic": "Peripheral Arterial Disease", "stem": "In patients with acute limb ischemia, the following is TRUE EXCEPT:", "options": ["Immediate anticoagulation is indicated", "Hypercoagulable workup should be performed prior to heparin initiation in all patients", "There is no clear superiority for thrombolysis over surgery in terms of a 30-day limb salvage on mortality", "In the United States, surgery is used three- to five fold more frequently than thrombolysis"], "answer": "B", "answerText": "The patient should be immediately anticoagulated to prevent clot propagation, and a hypercoagulable workup should be performed prior to heparin initiation only if there is sufficient suspicion.", "source": "Source: *Schwartz's ABSITE*, Ch. 23 Arterial Disease"}, {"id": "vascular-09e61a71", "topic": "Peripheral Arterial Disease", "stem": "Which of the following is TRUE about atherosclerotic aortoiliac occlusive disease?", "options": ["Classified into three times with type I occurring in 5% to 10% to patient extending into the lower extremities below the knee", "Type II aortoiliac disease represents diffuse aortoiliac disease above the inguinal ligament", "Type III represents multisegment occlusive disease involving the aortoiliac area and extending to the supra renal aorta", "Type I is more frequently found in men"], "answer": "B", "answerText": "Type II aortoiliac disease represents a more diffuse atherosclerotic progression involving predominantly the abdominal aorta with extension into the common iliac artery, affecting about 25% of patients.", "source": "Source: *Schwartz's ABSITE*, Ch. 23 Arterial Disease"}, {"id": "vascular-bdc5c09f", "topic": "Peripheral Arterial Disease", "stem": "In the absence of a suitable vein for lower extremity bypass, prosthetic grafts can be used. Which of the following can be used to improve patency of prosthetic grafts?", "options": ["Altering the geometry at the distal anastomosis by increasing the size of the arteriotomy", "Bonding agents into the outer surface of the graft", "Bonding anticoagulants to the conduit to improve patency of the graft", "Applying rings to the graft to improve patency"], "answer": "C", "answerText": "Binding anticoagulants to the conduit improves patency; a randomized trial suggested heparin-bonded Dacron or PTFE was superior to plain PTFE for above-knee popliteal bypass (3-year primary patency 55% vs 42%).", "source": "Source: *Schwartz's ABSITE*, Ch. 23 Arterial Disease"}, {"id": "vascular-5969dbaf", "topic": "Peripheral Arterial Disease", "stem": "The following is TRUE about fibromuscular dysplasia EXCEPT:", "options": ["The characteristic beaded appearance of fibromuscular dysplasia (FMD) is due to areas of medial thinning alternating with areas of stenosis", "The most commonly affected are the medium-sized arteries", "The commonest involved arteries are the internal carotid arteries", "FMD occurs most frequently in women"], "answer": "C", "answerText": "The most commonly affected arteries are the renal arteries; the internal carotid artery is the second most common site of involvement.", "source": "Source: *Schwartz's ABSITE*, Ch. 23 Arterial Disease"}, {"id": "vascular-e65a4d7b", "topic": "Peripheral Arterial Disease", "stem": "Which of the following is TRUE about adventitial cystic disease of the popliteal artery?", "options": ["It occurs in about 5% usually in the popliteal artery", "The disease affects men in a ratio approximately of 5:1", "Patients present in their 40s and 50s", "Computed tomography angiogram (CTA) of the lower extremities is the best diagnostic modality"], "answer": "B", "answerText": "Adventitial cystic disease is a rare condition (incidence 0.1%, usually the popliteal artery) that affects men in a ratio of approximately 5:1; color-flow duplex followed by T2-weighted MRI is the best diagnostic choice.", "source": "Source: *Schwartz's ABSITE*, Ch. 23 Arterial Disease"}, {"id": "vascular-855800c4", "topic": "Peripheral Arterial Disease", "stem": "In regard to obturator bypass, which of the following is TRUE?", "options": ["It is indicated in patients with groin hematoma and fever", "The conduit of Dacron, polytetrafluoroethylene (PTFE), or autologous vein is tunneled through the posteromedial portion of the obturator membrane", "The obturator artery and nerve pass in the anteromedial portion of the membrane", "5-year patency of 57% has been reported"], "answer": "D", "answerText": "Some authors have reported 57% 5-year patency and 77% 5-year limb salvage; the conduit is tunneled through the anteromedial portion of the obturator membrane, and the obturator artery and nerve pass posterolaterally.", "source": "Source: *Schwartz's ABSITE*, Ch. 23 Arterial Disease"}, {"id": "vascular-cf079a03", "topic": "Aortic Aneurysm", "stem": "Which of the following is TRUE in relation to abdominal aortic aneurysm?", "options": ["Sixty percent of an AAA are infrarenal in location", "There is a higher predilection for juxtarenal and suprarenal AAAs in women compared with men", "Clinically significant peripheral occlusive disease is common with AAA and is present in about 40% of all cases", "Concomitant common iliac and/or hypogastric artery aneurysms of care in about 50% to 55% of patients"], "answer": "B", "answerText": "Ninety percent of AAAs are infrarenal, but there is a higher predilection for juxtarenal and suprarenal AAAs in women compared with men; concomitant iliac aneurysms occur in 20% to 25%.", "source": "Source: *Schwartz's ABSITE*, Ch. 23 Arterial Disease"}, {"id": "vascular-da81bbd4", "topic": "Aortic Aneurysm", "stem": "The ideal characteristics of an aneurysm for endovascular abdominal aortic aneurysm repair include all of the following EXCEPT:", "options": ["Neck length more than 20 mm", "Neck diameter >18 mm, and <32 mm", "External iliac artery diameter >7 mm", "Aortic neck angle < 60 degrees"], "answer": "A", "answerText": "The proximal aortic neck requirements are a diameter of 18 to 28 mm and a minimum length of 15 mm, not more than 20 mm.", "source": "Source: *Schwartz's ABSITE*, Ch. 23 Arterial Disease"}, {"id": "vascular-081240a5", "topic": "Carotid Artery Disease", "stem": "The following conditions qualify patients for being high surgical risk for carotid endarterectomy EXCEPT:", "options": ["High carotid bifurcation above C2 vertebral body", "Low common carotid artery, below clavicle", "Ipsilateral laryngeal nerve palsy", "Tracheostomy"], "answer": "C", "answerText": "Anatomic high-risk factors include high carotid bifurcation above C2, low common carotid artery below the clavicle, tracheostomy, and contralateral (not ipsilateral) laryngeal nerve palsy.", "source": "Source: *Schwartz's ABSITE*, Ch. 23 Arterial Disease"}, {"id": "vascular-53fef23f", "topic": "Carotid Artery Disease", "stem": "Which of the following is TRUE about patients with a stroke?", "options": ["Eighty-five percent of all strokes are hemorrhagic and 15% are ischemic", "The commonest cause of the stroke is lacunar stroke. It occurs in about 30% of the patients", "Cerebrovascular accident is used interchangeably with hemorrhagic stroke", "Prior history of neurological symptoms such as transient ischemic attack (TIA) or stroke is a predictor for recurrent ipsilateral stroke"], "answer": "D", "answerText": "A prior history of neurologic symptoms such as TIA or stroke is an important determinant for recurrent ipsilateral stroke; 85% of all strokes are ischemic and 15% hemorrhagic.", "source": "Source: *Schwartz's ABSITE*, Ch. 23 Arterial Disease"}, {"id": "vascular-d003f496", "topic": "Carotid Artery Disease", "stem": "In regard to cerebral monitoring during carotid endarterectomy, which of the following is TRUE?", "options": ["If the patient is awake, the best monitoring is stump pressure", "Electroencephalogram (EEG) reflecting focal decreases in amplitude and slowing of the EEG waves are reflective of cerebral ischemia", "A decrease to <80% of baseline velocity in the ipsilateral middle cerebral artery is a sign of cerebral ischemia", "Stump pressure measurement is the most sensitive test for potential cerebral ischemia"], "answer": "B", "answerText": "Under general anesthesia, focal ipsilateral decreases in amplitude and slowing of EEG waves are indicative of cerebral ischemia; a decrease to <50% (not 80%) of baseline ipsilateral middle cerebral artery velocity is a sign of ischemia.", "source": "Source: *Schwartz's ABSITE*, Ch. 23 Arterial Disease"}, {"id": "vascular-aa4c4f5e", "topic": "Carotid Artery Disease", "stem": "Regarding carotid body tumors, which of the following is TRUE?", "options": ["The normal carotid body is located in the media or the transition. Between the media and intima at the bifurcation of the common carotid artery", "Carotid body tumors are rare lesions of neuromuscular system", "Approximately 20% to 25% of carotid body tumors are malignant", "About 35% of the carotid body tumors are hereditary"], "answer": "D", "answerText": "Approximately 35% of carotid body tumors are hereditary; only 5% to 7% are malignant, and the normal carotid body is located in the adventitia or periadventitial tissue at the carotid bifurcation.", "source": "Source: *Schwartz's ABSITE*, Ch. 23 Arterial Disease"}, {"id": "vascular-3da848ba", "topic": "Venous Thromboembolism and DVT", "stem": "Which of the following factors is the most important in the development of spontaneous deep vein thrombosis?", "options": ["Stasis", "Endothelial Damage", "Hypercoagulability", "All of the above"], "answer": "C", "answerText": "Of Virchow's three factors, relative hypercoagulability appears most important in most cases of spontaneous (idiopathic) VTE, whereas stasis and endothelial damage play a greater role in provoked VTE.", "source": "Source: *Schwartz's ABSITE*, Ch. 24 Venous and Lymphatic Disease"}, {"id": "vascular-8e3182ec", "topic": "Venous Thromboembolism and DVT", "stem": "All of the following are acquired risk factors for venous thromboembolism (VTE) EXCEPT:", "options": ["Nephrotic syndrome", "Factor V Leiden", "Malignancy", "Pregnancy", "Obesity", "Varicose veins"], "answer": "B", "answerText": "Factor V Leiden mutation is a heritable, not acquired, risk factor; acquired factors include malignancy, pregnancy, obesity, nephrotic syndrome, and varicose veins.", "source": "Source: *Schwartz's ABSITE*, Ch. 24 Venous and Lymphatic Disease"}, {"id": "vascular-17c10841", "topic": "Venous Thromboembolism and DVT", "stem": "Venous thromboembolism (VTE) is associated with all of the following EXCEPT:", "options": ["Increased morbidity and mortality", "Pulmonary hypertension", "Postthrombotic syndrome", "No change in future risk of VTE"], "answer": "D", "answerText": "VTE places patients at higher risk for recurrence and post-VTE sequelae such as pulmonary hypertension and postthrombotic syndrome, with 4% and up to 30% incidence, respectively.", "source": "Source: *Schwartz's ABSITE*, Ch. 24 Venous and Lymphatic Disease"}, {"id": "vascular-f340bd16", "topic": "Venous Thromboembolism and DVT", "stem": "Phlegmasia cerulea dolens is best described as:", "options": ["Asymptomatic, but extensive deep vein thrombosis (DVT)", "Isolated popliteal vein thrombosis", "Extensive DVT of the major axial deep venous channels of the lower extremity potentially complicated by venous gangrene and/or the need for amputation", "Painless lower extremity swelling"], "answer": "C", "answerText": "Extensive DVT of the major axial deep venous channels with relative sparing of collateral veins causes phlegmasia cerulea dolens, characterized by pain, pitting edema, and cyanosis, and can be complicated by venous gangrene and the need for amputation.", "source": "Source: *Schwartz's ABSITE*, Ch. 24 Venous and Lymphatic Disease"}, {"id": "vascular-c0051088", "topic": "Venous Thromboembolism and DVT", "stem": "All of the following are absolute contraindications to catheter-directed thrombolysis EXCEPT:", "options": ["Prior history of ischemic or hemorrhagic stroke within 3 months", "Traumatic cardiopulmonary resuscitation within 3 weeks", "Known intracranial neoplasm", "Age > 75 years"], "answer": "D", "answerText": "Absolute contraindications include stroke within 3 months, head trauma within 3 months, neurologic surgery within 6 months, known intracranial neoplasm, and traumatic CPR within 3 weeks — not age > 75 years.", "source": "Source: *Schwartz's ABSITE*, Ch. 24 Venous and Lymphatic Disease"}, {"id": "vascular-c7cf8c3a", "topic": "Venous Thromboembolism and DVT", "stem": "May-Thurner syndrome is an anatomical factor associated with increased deep vein thrombosis (DVT) formation, and is characterized by which of the following?", "options": ["Narrowing of the left iliac vein at the site where the right iliac artery crosses over it", "Narrowing of the left renal vein as it traverses beneath the superior mesenteric artery", "Subclavian vein narrowing due to repetitive upper extremity effort", "A rapidly expanding hemangioma"], "answer": "A", "answerText": "At the site where the right iliac artery crosses over the left iliac vein, the left iliac vein may become chronically narrowed, predisposing to iliofemoral venous thrombosis.", "source": "Source: *Schwartz's ABSITE*, Ch. 24 Venous and Lymphatic Disease"}, {"id": "vascular-41f857a8", "topic": "Venous Thromboembolism and DVT", "stem": "Which of the following statements related to inferior vena cava (IVC) filters is TRUE?", "options": ["Placement of an IVC filter allows for a reduced duration of anticoagulation therapy", "In patients with a proximal DVT, placement of an IVC filter reduces rate of pulmonary embolism, and also prolongs early and late survival", "The rate of fatal complications related to IVC filters is <0.12%", "An IVC filter is safe to leave in place after it is no longer needed", "All of above"], "answer": "C", "answerText": "The rate of fatal complications related to IVC filters is <0.12%; filters do not shorten anticoagulation or prolong survival, and the FDA recommends removal as soon as they are no longer needed.", "source": "Source: *Schwartz's ABSITE*, Ch. 24 Venous and Lymphatic Disease"}, {"id": "vascular-49d17602", "topic": "Venous Thromboembolism and DVT", "stem": "According to the American College of Chest Physicians, the recommended duration of long-term antithrombotic therapy after provoked deep vein thrombosis (DVT) is:", "options": ["2 weeks", "1 month", "3 months", "6 months"], "answer": "C", "answerText": "The ACCP recommends vitamin K antagonist or LMWH therapy for 3 months for a first episode of DVT associated with a transient risk factor or surgery.", "source": "Source: *Schwartz's ABSITE*, Ch. 24 Venous and Lymphatic Disease"}, {"id": "vascular-0b3582fa", "topic": "Varicose Veins", "stem": "All of the following are appropriate therapies for suppurative thrombophlebitis (SVT) EXCEPT:", "options": ["Nonsteroidal anti-inflammatory medications", "Antibiotics", "Systemic steroid therapy", "Removal of existing indwelling venous catheters"], "answer": "C", "answerText": "In suppurative SVT, antibiotics and removal of any existing indwelling catheters are mandatory, and anti-inflammatory medications reduce extension or recurrence; systemic steroids are not part of therapy.", "source": "Source: *Schwartz's ABSITE*, Ch. 24 Venous and Lymphatic Disease"}];</script><script src="../assets/quiz.js?v=6505bd0c"></script>
