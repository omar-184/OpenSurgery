<main class="wrap page"><div><div class="crumbs"><a href="index.html">Question Bank</a> › <a href="pediatric.html">Pediatric Surgery</a></div><article><h1>Pediatric Surgery: Practice</h1></article><div id="quiz"></div></div></main><script>window.QUIZ_MODE="practice";window.QUIZ_DATA=[{"topic": "Pyloric Stenosis", "stem": "A 4-week-old full-term, otherwise healthy female is admitted with nonbilious projectile emesis. Ultrasound shows a pyloric channel length of 16 mm and a pyloric thickness of 4 mm. Labs show hypokalemic, hypochloremic metabolic alkalosis. What is the next best step in management?", "options": ["Fluid resuscitation with 5% dextrose and 0.45% saline with added potassium until correction of electrolyte abnormalities", "Fluid resuscitation with normal saline until achieving a urine output of >2 mL/kg per hour for 24 hours", "Immediate laparoscopic pyloromyotomy", "Emergent open pyloromyotomy"], "answer": "A", "answerText": "Pyloric stenosis is never a surgical emergency; fluid resuscitation with 5% dextrose and 0.45% saline with added potassium to correct the electrolyte abnormalities and metabolic alkalosis is essential prior to induction of general anesthesia.", "source": "Source: *Schwartz's ABSITE*, Ch. 39"}, {"topic": "Intussusception", "stem": "A 9-month-old boy presents with two episodes of vomiting as well as episodes of colicky pain. His abdominal examination is notable for upper abdominal tenderness and his stools are guaiac positive. Ultrasound demonstrates a target sign. He is taken for an air-contrast enema. What is the likelihood that he will need operative intervention?", "options": ["25%", "50%", "75%", "90%"], "answer": "A", "answerText": "The air enema is both diagnostic and usually curative, with radiographic reduction succeeding in roughly 60% to 90% of cases, so only about a quarter of patients require operative intervention.", "source": "Source: *Schwartz's ABSITE*, Ch. 39"}, {"topic": "Hirschsprung's Disease", "stem": "How is the diagnosis of Hirschsprung disease definitively made?", "options": ["Observation of failure to pass meconium within 48 hours after birth", "Barium enema showing a rectosigmoid ratio < 1", "Rectal biopsies with no ganglion cells in the myenteric plexus", "Barium enema showing a rectosigmoid ratio > 1"], "answer": "C", "answerText": "The definitive diagnosis is made by rectal biopsy showing absence of ganglion cells in the myenteric plexuses, increased acetylcholinesterase staining, and hypertrophied nerve bundles.", "source": "Source: *Schwartz's ABSITE*, Ch. 39"}, {"topic": "Congenital Diaphragmatic Hernia", "stem": "Operative management of a newborn with the chest X-ray shown in Fig. 39-1 should occur:", "options": ["Immediately after birth", "Within 24 hours after birth", "Within 72 hours after birth", "None of the above"], "answer": "D", "answerText": "Repair of congenital diaphragmatic hernia is no longer considered a surgical emergency; current management is directed first toward the persistent pulmonary hypertension, which is usually seen within 7 to 10 days but may take several weeks to develop.", "source": "Source: *Schwartz's ABSITE*, Ch. 39"}, {"topic": "Undescended Testis", "stem": "Undescended testes are usually repaired by what age?", "options": ["6 months", "1 year of age", "2 years of age", "4 years of age"], "answer": "C", "answerText": "Histologic study of undescended testicles demonstrated a decreasing presence of spermatogonia after 2 years of age, from the risk of impaired spermatogenesis at higher extrascrotal temperature.", "source": "Source: *Schwartz's ABSITE*, Ch. 39"}];</script><script src="../assets/quiz.js"></script>
