<main class="wrap page"><div><div class="crumbs"><a href="index.html">Question Bank</a> › <a href="breast.html">Breast</a></div><article><h1>Breast: Practice</h1></article><div id="quiz"></div></div></main><script>window.QUIZ_MODE="practice";window.QUIZ_CATEGORY="breast";window.QUIZ_DATA=[{"id": "breast-b64fb1db", "topic": "Breast Cancer", "stem": "All of the following are TRUE concerning breast lobular carcinoma in situ (LCIS) EXCEPT:", "options": ["Develops only in the female breast", "Cytoplasmic mucoid globules are a distinctive cellular feature", "Frequency of LCIS cannot be reliably determined", "The average age at diagnosis is 65 to 70 years"], "answer": "D", "answerText": "The average age at diagnosis of LCIS is 45 years, roughly 15 to 25 years younger than for invasive breast cancer.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 17 Breast"}, {"id": "breast-c2be5e89", "topic": "Breast Cancer", "stem": "Risk factors for the development of breast cancer include:", "options": ["Early menarche", "Nulliparity", "Late menopause", "Longer lactation periods"], "answer": "D", "answerText": "Per the book, factors increasing the number of menstrual cycles (early menarche, nulliparity, late menopause) raise risk, whereas longer lactation decreases total menstrual cycles and is protective.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 17 Breast"}, {"id": "breast-e079de6c", "topic": "Breast Cancer", "stem": "Which of the following concerning breast cancer staging is correct?", "options": ["Stage I tumors have no metastases to either lymph nodes or distant sites", "Stage III tumors include some with distant metastases (M1 disease)", "Inflammatory carcinoma is considered T4 disease", "N4 disease includes metastases to highest contralateral axillary nodes"], "answer": "C", "answerText": "Inflammatory carcinoma is classified as T4 disease in breast cancer staging.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 17 Breast"}, {"id": "breast-8042df2e", "topic": "Breast Cancer", "stem": "Which of the following statements about the management of distal carcinoma in situ (DCIS) is TRUE?", "options": ["DCIS treated by mastectomy has a local recurrence rate of <2%", "Extensive DCIS should be treated with tamoxifen followed by lumpectomy", "Specimen mammography is only useful for patients with small amounts of DCIS", "Postoperative tamoxifen is useful in DCIS patients whose tumors are estrogen receptor negative"], "answer": "A", "answerText": "Mastectomy is the gold standard for DCIS, with local recurrence and mortality rates under 2%; tamoxifen is considered only for estrogen receptor-positive DCIS.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 17 Breast"}, {"id": "breast-a3fe309d", "topic": "Breast Cancer", "stem": "Patients not suitable for sentinel node biopsy include all of the following EXCEPT:", "options": ["Inflammatory carcinoma of the breast", "Prior axillary surgery", "Biopsy proven distant metastases", "Breast lower inner quadrant carcinoma"], "answer": "D", "answerText": "Tumor location in the lower inner quadrant does not preclude sentinel node biopsy; it is not recommended in inflammatory breast cancer, biopsy-proven axillary metastasis, or prior axillary surgery.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 17 Breast"}, {"id": "breast-be2f2b63", "topic": "Breast Cancer", "stem": "Which of the following is TRUE concerning breast cancer during pregnancy?", "options": ["Metastases to lymph nodes occurs in approximately 75% of these patients", "Approximately 50% of breast nodules developing during pregnancy are malignant", "Mammography is especially useful in localizing small lesions", "There is risk of chemotherapy teratogenicity if used during the second, but not the third, trimester of pregnancy"], "answer": "A", "answerText": "Axillary lymph node metastases are present in up to 75% of women with breast cancer diagnosed during pregnancy.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 17 Breast"}, {"id": "breast-b1e89541", "topic": "Breast Cancer", "stem": "Correct statements about risk of developing breast cancer include all of the following EXCEPT:", "options": ["Lifetime risk in US females is 20%", "Increased risk with exposure to therapeutic radiation in adolescence", "Early menarche", "Older age at first live birth"], "answer": "A", "answerText": "The average lifetime breast cancer risk for newborn US females is 12%, not 20%.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 17 Breast"}, {"id": "breast-a3e68fd0", "topic": "Breast Cancer", "stem": "Which of the following are correct concerning BRCA mutations?", "options": ["Fifteen percent of breast cancers are caused by BRCA mutations", "BRCA mutations play a role in DNA damage response pathways", "Male BRCA2 mutation carriers have an equal risk of developing breast cancer compared to noncarrier males", "Twenty-five percent of women with BRCA mutation have inherited the mutation from their fathers"], "answer": "B", "answerText": "BRCA genes function in cell cycle control and DNA damage repair pathways; only up to 5% of breast cancers are from germline mutations, male BRCA2 carriers have a 100-fold increased risk, and 50% of carriers inherit the mutation from their fathers.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 17 Breast"}, {"id": "breast-96e04d6a", "topic": "Breast Cancer", "stem": "Therapeutic options for early invasive breast cancer include all of the following EXCEPT:", "options": ["Mastectomy with axillary staging", "Neoadjuvant systemic therapy with radiation", "Lumpectomy with axillary staging and radiation", "Mastectomy with axillary staging and immediate reconstruction"], "answer": "B", "answerText": "NSABP B-06 established mastectomy and lumpectomy with radiation as equivalent standard options, and immediate reconstruction can accompany mastectomy; neoadjuvant systemic therapy with radiation alone is not a therapeutic option for early invasive disease.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 17 Breast"}, {"id": "breast-e903f775", "topic": "Breast Cancer", "stem": "Which of the following are true concerning mastectomy?", "options": ["Skin-sparing mastectomy removes all breast tissue, the nipple-areola complex, and previous biopsy scars", "Extended simple mastectomy removes all breast tissue, nipple-areola complex, and level I and II axillary lymph nodes", "Modified radical mastectomy removes all breast tissue, nipple-areola complex, and level I and II axillary lymph nodes", "Radical mastectomy removes all breast tissue, nipple-areola complex, and levels I, II, and III axillary lymph nodes, the pectoralis major muscle, and internal mammary lymph nodes sampling"], "answer": "A", "answerText": "A skin-sparing mastectomy removes all breast tissue, the nipple-areola complex, and scars from prior biopsy procedures.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 17 Breast"}, {"id": "breast-bd73e0ad", "topic": "Benign Breast Disease (Fibroadenoma/Cysts)", "stem": "Lesions with malignant potential include all of the following EXCEPT:", "options": ["Intraductal papilloma", "Atypical ductal hyperplasia (ADH)", "Sclerosing adenosis", "Atypical lobular hyperplasia (ALH)"], "answer": "C", "answerText": "Sclerosing adenosis is prevalent during the childbearing and premenopausal years and has no malignant potential.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 17 Breast"}, {"id": "breast-f11ee2fe", "topic": "Mastitis and Breast Abscess", "stem": "Concerning infections of the breast, which of the following are TRUE?", "options": ["Most common organism is Escherichia coli", "Operative drainage is the most common therapeutic approach", "Fungal infections of the breast are most commonly initiated by nursing infants", "Bilateral Mondor disease is more common than unilateral disease"], "answer": "C", "answerText": "Intraoral fungi introduced by the suckling infant can initiate breast infection presenting as mammary abscesses near the nipple-areola complex; the most common organisms are S. aureus and Streptococcus, initial treatment is antibiotics plus aspiration, and Mondor disease is rarely bilateral.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 17 Breast"}, {"id": "breast-977e209e", "topic": "Gynecomastia", "stem": "Concerning gynecomastia, which of the following is TRUE?", "options": ["During senescence gynecomastia is usually unilateral", "During puberty gynecomastia is usually bilateral", "Gynecomastia is associated with breast cancer in Klinefelter syndrome patients", "Gynecomastia is classified as per a three-grade system"], "answer": "C", "answerText": "The hypoandrogenic state of Klinefelter syndrome (XXY), in which gynecomastia is usually evident, is associated with an increased risk of breast cancer.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 17 Breast"}, {"id": "breast-3d9b94dc", "topic": "Gynecomastia", "stem": "All of the following are mechanisms underlying development of gynecomastia EXCEPT:", "options": ["Neoplasms of testis", "Lung carcinoma", "Cirrhosis", "Marfan syndrome"], "answer": "D", "answerText": "Marfan syndrome is not among the causes of gynecomastia listed in the book's chart, unlike testicular neoplasms, lung carcinoma, and cirrhosis.", "source": "Source: <em>Schwartz's ABSITE<\/em>, Ch. 17 Breast"}];</script><script src="../assets/quiz.js?v=c49484c0"></script>
